<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halte Plantsoen</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 background:#0d0a08;
 color:#ead8b5;

}

body{
 background:
 radial-gradient(circle at 50% 0,#392719,#110c09 55%,#060504)
}

main{
 width:min(1050px,94%);
 margin:auto;
 padding:22px 0 50px
}

header{text-align:center;margin-bottom:24px}

.orn{
 color:#9b7848;
 font-size:25px;
 letter-spacing:10px
}

h1{
 margin:6px 0 8px;
 font-size:clamp(35px,9vw,72px);
 letter-spacing:4px;
 color:#d9bd85;
 text-shadow:3px 4px 0 #24160d,0 8px 20px #000
}

header p{
 margin:0;
 color:#b99d6d;
 letter-spacing:3px;
 font-size:15px
}

#files{
 position:absolute;
 width:1px;
 height:1px;
 opacity:0
}

.pick{
 display:block;
 padding:18px;
 text-align:center;
 cursor:pointer;
 border:2px solid #795c37;
 background:linear-gradient(#49321e,#21140d);
 color:#e6cfa4;
 font-weight:bold;
 font-size:18px;
 box-shadow:inset 0 0 0 3px #120b07,0 7px 20px #000
}

#status{
 text-align:center;
 color:#aa9777;
 margin:13px 0 20px
}

#previewWrap{display:none}

.preview{
 padding:15px;
 background:#090705;
 border:1px solid #705331;
 box-shadow:0 12px 35px #000
}

canvas{
 display:block;
 width:100%;
 height:auto
}

.actions{
 display:flex;
 gap:10px;
 margin-top:14px
}

button{
 flex:1;
 padding:16px;
 border:2px solid #795c37;
 background:linear-gradient(#49321e,#21140d);
 color:#ead4aa;
 font:bold 17px Georgia,serif
}

#queue{margin-top:40px}

#queue h2{
 text-align:center;
 color:#d0b37d;
 font-size:31px;
 letter-spacing:3px
}

.queueGrid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
 gap:15px
}

.card{
 background:#17100b;
 padding:8px;
 border:1px solid #61482d;
 box-shadow:0 7px 18px #000
}

.card img{width:100%;display:block}

.cardInfo{
 text-align:center;
 padding:8px;
 color:#9d8867;
 font-size:12px
}

@media(max-width:600px){
 .actions{flex-direction:column}
}
</style>
</head>

<body>

<main>

<header>
 <div class="orn">✦ ❦ ✦</div>
 <h1>HALTE PLANTSOEN</h1>
 <p>HALLOWEEN · 23 OKTOBER 2026</p>
</header>

<input id="files" type="file" accept="image/*" multiple>

<label class="pick" for="files">
 KIES FOTO'S VAN JE SAMSUNG
</label>

<div id="status">
 Kies één of meer foto's.
</div>

<div id="previewWrap">

 <div class="preview">
  <canvas id="canvas"></canvas>
 </div>

 <div class="actions">
  <button id="save">IN WACHTRIJ ZETTEN</button>
  <button id="clear">ANNULEREN</button>
 </div>

</div>

<section id="queue">
 <h2>✦ WACHTRIJ ✦</h2>
 <div id="queueGrid" class="queueGrid"></div>
</section>

</main>

<script>

const filesInput=document.getElementById("files");
const statusEl=document.getElementById("status");
const wrap=document.getElementById("previewWrap");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const queueGrid=document.getElementById("queueGrid");
const saveBtn=document.getElementById("save");
const clearBtn=document.getElementById("clear");

let processed=[];

filesInput.addEventListener("change",async()=>{

 const files=[...filesInput.files];

 if(!files.length)return;

 statusEl.textContent="Foto wordt verwerkt...";

 processed=[];

 for(const file of files){

  const img=await loadImage(file);

  processed.push(makePhoto(img));

 }

 show(processed[0]);

 wrap.style.display="block";

 statusEl.textContent=
  processed.length===1
   ?"Foto klaar om te bekijken."
   :processed.length+" foto's klaar.";

 wrap.scrollIntoView({
  behavior:"smooth",
  block:"start"
 });

});


function loadImage(file){

 return new Promise((resolve,reject)=>{

  const url=URL.createObjectURL(file);
  const img=new Image();

  img.onload=()=>{
   URL.revokeObjectURL(url);
   resolve(img);
  };

  img.onerror=reject;
  img.src=url;

 });

}


function show(img){

 canvas.width=img.width;
 canvas.height=img.height;

 ctx.clearRect(
  0,0,
  canvas.width,
  canvas.height
 );

 ctx.drawImage(img,0,0);

}


/* =====================================================
   NIEUWE 1913 FOTO-STIJL
===================================================== */

function makePhoto(img){

 const max=1500;

 let w=img.naturalWidth;
 let h=img.naturalHeight;

 if(w>max){

  const s=max/w;

  w=Math.round(w*s);
  h=Math.round(h*s);

 }

 const c=document.createElement("canvas");
 c.width=w;
 c.height=h;

 const x=c.getContext("2d");

 x.drawImage(img,0,0,w,h);


 /* -----------------------------------------------
    FOTO KLEUR
 ------------------------------------------------ */

 const pixels=x.getImageData(0,0,w,h);
 const d=pixels.data;

 for(let i=0;i<d.length;i+=4){

  let r=d[i];
  let g=d[i+1];
  let b=d[i+2];

  /*
    Oude emulsie:
    warm maar NIET alles beige.
  */

  r=r*1.045+4;
  g=g*.99;
  b=b*.92;

  /*
    iets sterker contrast
  */

  r=(r-128)*1.12+128;
  g=(g-128)*1.10+128;
  b=(b-128)*1.08+128;

  d[i]=Math.max(0,Math.min(255,r));
  d[i+1]=Math.max(0,Math.min(255,g));
  d[i+2]=Math.max(0,Math.min(255,b));

 }

 x.putImageData(pixels,0,0);


 /* -----------------------------------------------
    PAPIER / FILM TEXTUUR
 ------------------------------------------------ */

 x.save();

 for(let i=0;i<4500;i++){

  const px=Math.random()*w;
  const py=Math.random()*h;

  const a=.025+Math.random()*.075;

  x.fillStyle=
   Math.random()>.5
    ?`rgba(255,225,170,${a})`
    :`rgba(20,8,2,${a})`;

  const s=Math.random()<.9?1:2;

  x.fillRect(px,py,s,s);

 }

 x.restore();


 /* -----------------------------------------------
    OUDE INKT / VLEKKEN
 ------------------------------------------------ */

 x.save();

 for(let i=0;i<25;i++){

  const px=Math.random()*w;
  const py=Math.random()*h;
  const r=5+Math.random()*55;

  const stain=x.createRadialGradient(
   px,py,0,
   px,py,r
  );

  stain.addColorStop(
   0,
   "rgba(55,25,8,.18)"
  );

  stain.addColorStop(
   .5,
   "rgba(55,25,8,.05)"
  );

  stain.addColorStop(
   1,
   "rgba(55,25,8,0)"
  );

  x.fillStyle=stain;

  x.beginPath();
  x.arc(px,py,r,0,Math.PI*2);
  x.fill();

 }

 x.restore();


 /* -----------------------------------------------
    KRASSEN
 ------------------------------------------------ */

 x.save();

 x.globalAlpha=.22;

 for(let i=0;i<25;i++){

  const px=Math.random()*w;
  const py=Math.random()*h;

  x.strokeStyle=
   Math.random()>.5
    ?"#f3dfb5"
    :"#1d0d06";

  x.lineWidth=Math.random()<.8?1:2;

  x.beginPath();

  x.moveTo(px,py);

  x.lineTo(
   px+20+Math.random()*150,
   py+(Math.random()*18-9)
  );

  x.stroke();

 }

 x.restore();


 /* -----------------------------------------------
    DONKERE ONGELIJKE FOTO-RAND
 ------------------------------------------------ */

 const vignette=x.createRadialGradient(
  w/2,h/2,
  Math.min(w,h)*.25,
  w/2,h/2,
  Math.max(w,h)*.73
 );

 vignette.addColorStop(0,"rgba(0,0,0,0)");
 vignette.addColorStop(.60,"rgba(0,0,0,.02)");
 vignette.addColorStop(.82,"rgba(30,10,3,.25)");
 vignette.addColorStop(1,"rgba(5,2,1,.82)");

 x.fillStyle=vignette;
 x.fillRect(0,0,w,h);


 /* =================================================
    ECHT DONKER VICTORIAANS KADER
 ================================================= */

 const b=Math.min(w,h)*.075;

 x.save();

 /*
    brede donkere basis
 */

 x.fillStyle="rgba(15,8,4,.72)";

 x.fillRect(
  0,0,w,b
 );

 x.fillRect(
  0,h-b,w,b
 );

 x.fillRect(
  0,0,b,h
 );

 x.fillRect(
  w-b,0,b,h
 );


 /*
    dubbele ouderwetse lijnen
 */

 x.strokeStyle="#17100b";
 x.lineWidth=b*.60;

 x.strokeRect(
  b*.38,
  b*.38,
  w-b*.76,
  h-b*.76
 );

 x.strokeStyle="#9a7645";
 x.lineWidth=Math.max(2,b*.10);

 x.strokeRect(
  b*.78,
  b*.78,
  w-b*1.56,
  h-b*1.56
 );

 x.strokeStyle="#2a180d";
 x.lineWidth=Math.max(2,b*.14);

 x.strokeRect(
  b*1.08,
  b*1.08,
  w-b*2.16,
  h-b*2.16
 );

 x.strokeStyle="#a07b49";
 x.lineWidth=Math.max(1,b*.035);

 x.strokeRect(
  b*1.38,
  b*1.38,
  w-b*2.76,
  h-b*2.76
 );


 /*
    hoekornamenten
 */

 corner(x,b*1.05,b*1.05,1,1);
 corner(x,w-b*1.05,b*1.05,-1,1);
 corner(x,b*1.05,h-b*1.05,1,-1);
 corner(x,w-b*1.05,h-b*1.05,-1,-1);


 /*
    sierlijke middenornamenten
 */

 x.fillStyle="#a07a47";
 x.font=`${Math.max(22,b*.42)}px Georgia`;
 x.textAlign="center";

 x.fillText("❦",w/2,b*.72);
 x.fillText("❦",w/2,h-b*.48);


 x.restore();


 /* =================================================
    TITEL
 ================================================= */

 x.save();

 x.textAlign="center";
 x.textBaseline="middle";

 const title=Math.max(
  28,
  Math.min(w*.075,82)
 );

 x.font=
  `bold ${title}px Georgia,"Times New Roman",serif`;

 /*
    diepe drukschaduw
 */

 x.fillStyle="rgba(0,0,0,.9)";

 x.fillText(
  "HALTE PLANTSOEN",
  w/2+4,
  b*1.72+4
 );


 /*
    lichte oude inkt
 */

 x.fillStyle="#dfc
