<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halte Plantsoen — Fotowachtrij 1913</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17130f;color:#eee7d8;font-family:Georgia,serif}
main{max-width:900px;margin:auto;padding:22px}
h1{font-size:30px;margin:0 0 6px}
.sub{opacity:.75;margin-bottom:22px}
button,.pick{display:inline-block;border:1px solid #9b8a68;background:#30281d;color:#f3ead8;padding:12px 16px;border-radius:7px;font:inherit;cursor:pointer}
input{display:none}
#status{margin:16px 0;min-height:24px}
#previewWrap{display:none;background:#241d15;padding:16px;border-radius:10px}
canvas{display:block;width:100%;height:auto;background:#d9c7a5}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
#queue{margin-top:28px}
.queueGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#241d15;padding:8px;border-radius:8px}
.card img{width:100%;display:block}
.card small{display:block;margin-top:6px;opacity:.75}
.note{font-size:14px;opacity:.65;line-height:1.5;margin-top:18px}
</style>
</head>
<body>
<main>
<h1>Halte Plantsoen</h1>
<div class="sub">Fotowachtrij · 1913 · Halloween 23 oktober 2026</div>

<label class="pick" for="files">KIES FOTO'S VAN JE SAMSUNG</label>
<input id="files" type="file" accept="image/*" multiple>

<div id="status">Kies één of meer foto's. De foto's worden op deze telefoon verwerkt.</div>

<div id="previewWrap">
  <canvas id="canvas"></canvas>
  <div class="actions">
    <button id="save">IN WACHTRIJ ZETTEN</button>
    <button id="clear">ANNULEREN</button>
  </div>
</div>

<section id="queue">
<h2>Wachtrij</h2>
<div id="queueGrid" class="queueGrid"></div>
</section>

<div class="note">
De originele Samsung-foto wordt niet veranderd. De site maakt een nieuwe versie met een oude 1913-uitstraling, kader en tekst.
</div>
</main>

  <script>
const filesInput = document.getElementById("files");
const statusEl = document.getElementById("status");
const wrap = document.getElementById("previewWrap");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const queueGrid = document.getElementById("queueGrid");
const saveBtn = document.getElementById("save");
const clearBtn = document.getElementById("clear");

let processed = [];


/* =========================================================
   FOTO MAKEN
   ========================================================= */

function makeProcessed(img){

  const maxW = 1800;
  const scale = Math.min(1, maxW / img.naturalWidth);

  const w = Math.round(img.naturalWidth * scale);
  const h = Math.round(img.naturalHeight * scale);

  const border = Math.max(42, Math.round(w * 0.027));
  const bottom = Math.max(220, Math.round(h * 0.17));

  canvas.width = w + border * 2;
  canvas.height = h + border + bottom;

  /* -------------------------------------------------------
     DONKERE OUDE PAPIERACHTERGROND
     ------------------------------------------------------- */

  ctx.fillStyle = "#2b1b12";
  ctx.fillRect(0, 0, canvas.width, canvas.height);


  /* -------------------------------------------------------
     FOTO OP EIGEN CANVAS
     ------------------------------------------------------- */

  const photo = document.createElement("canvas");
  photo.width = w;
  photo.height = h;

  const pctx = photo.getContext("2d");

  pctx.drawImage(img, 0, 0, w, h);


  /* -------------------------------------------------------
     KLEURCORRECTIE
     KLEUREN BLIJVEN ZICHTBAAR
     ------------------------------------------------------- */

  const imageData = pctx.getImageData(0, 0, w, h);
  const pixels = imageData.data;

  for(let i = 0; i < pixels.length; i += 4){

    let r = pixels[i];
    let g = pixels[i + 1];
    let b = pixels[i + 2];

    /*
      Oude warme filmtoon.
      Niet zwart-wit en niet zwaar sepia.
    */

    r = r * 1.06 + 4;
    g = g * 0.99 + 2;
    b = b * 0.91;

    /*
      Iets minder moderne digitale verzadiging.
    */

    const gemiddelde = (r + g + b) / 3;

    r = gemiddelde + (r - gemiddelde) * 0.94;
    g = gemiddelde + (g - gemiddelde) * 0.94;
    b = gemiddelde + (b - gemiddelde) * 0.94;

    /*
      Oudere film heeft iets zachter contrast.
    */

    r = (r - 128) * 1.04 + 128;
    g = (g - 128) * 1.04 + 128;
    b = (b - 128) * 1.04 + 128;

    /*
      Echte filmkorrel.
    */

    const korrel = (Math.random() - 0.5) * 16;

    pixels[i] = Math.max(0, Math.min(255, r + korrel));
    pixels[i + 1] = Math.max(0, Math.min(255, g + korrel));
    pixels[i + 2] = Math.max(0, Math.min(255, b + korrel));
  }

  pctx.putImageData(imageData, 0, 0);


  /* -------------------------------------------------------
     FOTO PLAATSEN
     ------------------------------------------------------- */

  ctx.drawImage(photo, border, border);


  /* -------------------------------------------------------
     WARME OUDE-FILM LAAG
     ------------------------------------------------------- */

  ctx.save();

  ctx.globalAlpha = 0.12;
  ctx.fillStyle = "#a77b43";
  ctx.fillRect(border, border, w, h);

  ctx.restore();


  /* -------------------------------------------------------
     DONKERE OUDE HOEKEN
     ------------------------------------------------------- */

  const vignette = ctx.createRadialGradient(
    canvas.width / 2,
    border + h / 2,
    Math.min(w, h) * 0.20,
    canvas.width / 2,
    border + h / 2,
    Math.max(w, h) * 0.72
  );

  vignette.addColorStop(0, "rgba(0,0,0,0)");
  vignette.addColorStop(0.55, "rgba(20,8,3,0)");
  vignette.addColorStop(0.78, "rgba(35,15,5,.12)");
  vignette.addColorStop(1, "rgba(5,2,1,.62)");

  ctx.fillStyle = vignette;
  ctx.fillRect(border, border, w, h);


  /* -------------------------------------------------------
     VERWEERDE VLEKKEN
     ------------------------------------------------------- */

  ctx.save();

  for(let i = 0; i < 35; i++){

    const x = border + Math.random() * w;
    const y = border + Math.random() * h;
    const radius = 2 + Math.random() * 18;

    ctx.globalAlpha = 0.035 + Math.random() * 0.07;

    ctx.fillStyle =
      i % 2 === 0
      ? "#3b2112"
      : "#ead09a";

    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();


  /* -------------------------------------------------------
     OUDE FILM KRASSEN
     ------------------------------------------------------- */

  ctx.save();

  for(let i = 0; i < 42; i++){

    const x = border + Math.random() * w;
    const y = border + Math.random() * h;

    const lengte = 10 + Math.random() * 100;

    ctx.globalAlpha = 0.08 + Math.random() * 0.12;
    ctx.lineWidth = Math.random() < 0.7 ? 1 : 2;

    ctx.strokeStyle =
      i % 3 === 0
      ? "#f0dfb8"
      : "#2a150c";

    ctx.beginPath();

    ctx.moveTo(x, y);

    ctx.lineTo(
      x + lengte,
      y + (Math.random() * 8 - 4)
    );

    ctx.stroke();
  }

  ctx.restore();


  /* -------------------------------------------------------
     OUDE FOTO RAND
     ------------------------------------------------------- */

  ctx.strokeStyle = "#170c07";
  ctx.lineWidth = 7;

  ctx.strokeRect(
    border,
    border,
    w,
    h
  );

  ctx.strokeStyle = "rgba(220,190,135,.55)";
  ctx.lineWidth = 2;

  ctx.strokeRect(
    border + 9,
    border + 9,
    w - 18,
    h - 18
  );


  /* -------------------------------------------------------
     ONDERSTE KADER
     ------------------------------------------------------- */

  ctx.fillStyle = "#8f7045";

  ctx.fillRect(
    border,
    border + h,
    w,
    bottom
  );


  /* -------------------------------------------------------
     OUDE PAPIERSTRUCTUUR
     ------------------------------------------------------- */

  ctx.save();

  for(let i = 0; i < 45; i++){

    const x = border + Math.random() * w;
    const y = border + h + Math.random() * bottom;

    const radius = 1 + Math.random() * 12;

    ctx.globalAlpha = 0.04 + Math.random() * 0.09;

    ctx.fillStyle =
      i % 2
      ? "#2d180e"
      : "#e4c58c";

    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();


  /* -------------------------------------------------------
     HALLOWEEN ORNAMENTEN
     ------------------------------------------------------- */

  ctx.strokeStyle = "#241109";
  ctx.lineWidth = 2;

  const ornamentY = border + h + 31;


  /* LINKS */

  ctx.beginPath();

  ctx.moveTo(border + 22, ornamentY);

  ctx.bezierCurveTo(
    border + 42, ornamentY - 18,
    border + 58, ornamentY + 18,
    border + 80, ornamentY
  );

  ctx.bezierCurveTo(
    border + 102, ornamentY - 18,
    border + 122, ornamentY + 18,
    border + 150, ornamentY
  );

  ctx.stroke();


  /* RECHTS */

  ctx.beginPath();

  ctx.moveTo(canvas.width - border - 22, ornamentY);

  ctx.bezierCurveTo(
    canvas.width - border - 42, ornamentY - 18,
    canvas.width - border - 58, ornamentY + 18,
    canvas.width - border - 80, ornamentY
  );

  ctx.bezierCurveTo(
    canvas.width - border - 102, ornamentY - 18,
    canvas.width - border - 122, ornamentY + 18,
    canvas.width - border - 150, ornamentY
  );

  ctx.stroke();


  /* -------------------------------------------------------
     KLEINE SPINWEB-ACHTIGE DETAILS
     ------------------------------------------------------- */

  ctx.globalAlpha = 0.65;

  function web(x, y, spiegel){

    const richting = spiegel ? -1 : 1;

    ctx.beginPath();

    ctx.moveTo(x, y);

    ctx.lineTo(
      x + richting * 42,
      y + 38
    );

    ctx.moveTo(x, y);

    ctx.lineTo(
      x + richting * 50,
      y - 25
    );

    ctx.moveTo(x, y);

    ctx.lineTo(
      x + richting * 20,
      y + 52
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.arc(
      x + richting * 30,
      y + 15,
      14,
      0,
      Math.PI * 2
    );

    ctx.stroke();
  }

  web(border + 25, border + h + bottom - 35, false);
  web(canvas.width - border - 25, border + h + bottom - 35, true);

  ctx.globalAlpha = 1;


  /* -------------------------------------------------------
     TITEL
     ------------------------------------------------------- */

  ctx.fillStyle = "#211008";
  ctx.textAlign = "center";

  ctx.font =
    "bold " +
    Math.max(38, Math.round(w * 0.06)) +
    "px Georgia";

  ctx.fillText(
    "HALTE PLANTSOEN",
    canvas.width / 2,
    border + h + Math.max(94, Math.round(h * 0.07))
  );


  /* -------------------------------------------------------
     ONDERTITEL
     ------------------------------------------------------- */

  ctx.font =
    Math.max(22, Math.round(w * 0.028)) +
    "px Georgia";

  ctx.fillText(
    "HALLOWEEN · 23 OKTOBER 2026",
    canvas.width / 2,
    border + h + Math.max(145, Math.round(h * 0.108))
  );


  /* -------------------------------------------------------
     ONDERSTE ORNAMENT
     ------------------------------------------------------- */

  const lijnY = canvas.height - 24;

  ctx.strokeStyle = "#28130b";
  ctx.lineWidth = 2;

  ctx.beginPath();

  ctx.moveTo(
    canvas.width / 2 - 100,
    lijnY
  );

  ctx.lineTo(
    canvas.width / 2 - 18,
    lijnY
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    canvas.width / 2 + 18,
    lijnY
  );

  ctx.lineTo(
    canvas.width / 2 + 100,
    lijnY
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.arc(
    canvas.width / 2,
    lijnY,
    6,
    0,
    Math.PI * 2
  );

  ctx.stroke();


  return canvas.toDataURL("image/jpeg", 0.94);
}


/* =========================================================
   FOTO INLADEN
   ========================================================= */

function readImage(file){

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = () => {

      const img = new Image();

      img.onload = () => resolve(img);
      img.onerror = reject;

      img.src = reader.result;
    };

    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}


/* =========================================================
   FOTO KIEZEN
   ========================================================= */

filesInput.addEventListener("change", async () => {

  if(!filesInput.files.length) return;

  statusEl.textContent = "Foto's verwerken…";

  processed = [];

  wrap.style.display = "none";

  try{

    for(const file of filesInput.files){

      const img = await readImage(file);

      processed.push(
        makeProcessed(img)
      );
    }

    if(processed.length){

      const preview = new Image();

      preview.onload = () => {

        canvas.width = preview.naturalWidth;
        canvas.height = preview.naturalHeight;

        ctx.drawImage(
          preview,
          0,
          0
        );
      };

      preview.src = processed[0];

      wrap.style.display = "block";

      statusEl.textContent =
        processed.length +
        " foto" +
        (processed.length === 1 ? "" : "’s") +
        " verwerkt. Controleer de eerste foto.";
    }

  }catch(e){

    console.error(e);

    statusEl.textContent =
      "Er ging iets mis met het inladen van de foto.";
  }
});


/* =========================================================
   IN WACHTRIJ
   ========================================================= */

saveBtn.addEventListener("click", () => {

  if(!processed.length) return;

  for(const data of processed){

    const card = document.createElement("div");

    card.className = "card";


    const img = document.createElement("img");

    img.src = data;


    const small = document.createElement("small");

    small.textContent = "Wacht op goedkeuring";


    card.appendChild(img);
    card.appendChild(small);

    queueGrid.prepend(card);
  }


  statusEl.textContent =
    processed.length +
    " foto" +
    (processed.length === 1 ? "" : "’s") +
    " staan in de wachtrij.";

  processed = [];

  filesInput.value = "";

  wrap.style.display = "none";
});


/* =========================================================
   ANNULEREN
   ========================================================= */

clearBtn.addEventListener("click", () => {

  processed = [];

  filesInput.value = "";

  wrap.style.display = "none";

  statusEl.textContent =
    "Kies één of meer foto's.";
});
</script>
  
</body>
</html>
