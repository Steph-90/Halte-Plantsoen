<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Halte Plantsoen - Fotowachtrij</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#0b0705;
  color:#ead9b8;
  font-family:Georgia,"Times New Roman",serif;
}

body{padding:20px}

.panel{
  max-width:900px;
  margin:auto;
}

h1{
  margin:0;
  text-align:center;
  font-size:32px;
  letter-spacing:5px;
  color:#ead9b8;
}

.sub{
  text-align:center;
  margin:7px 0 25px;
  letter-spacing:2px;
}

.controls{
  background:#17100c;
  border:1px solid #76583d;
  padding:18px;
}

label.pick,
button{
  display:block;
  width:100%;
  padding:14px;
  border:1px solid #98724e;
  background:#302016;
  color:#f0dfba;
  font-family:Georgia,"Times New Roman",serif;
  font-size:16px;
  text-align:center;
  cursor:pointer;
}

label.pick:hover,
button:hover{
  background:#49301f;
}

input[type=file]{display:none}

.settings{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:15px;
}

.settings label{
  font-size:14px;
}

.settings input{
  width:100%;
  margin-top:6px;
  padding:11px;
  background:#0d0907;
  border:1px solid #684b33;
  color:#ead9b8;
  font-family:Georgia,"Times New Roman",serif;
  font-size:15px;
}

#status{
  text-align:center;
  margin-top:15px;
}

#previewWrap{
  display:none;
  margin-top:25px;
}

.preview{
  padding:13px;
  background:#21150e;
  border:1px solid #654832;
  box-shadow:0 0 30px #000;
}

canvas{
  display:block;
  width:100%;
  height:auto;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:12px;
}

#queue{
  max-width:900px;
  margin:35px auto;
}

#queue h2{
  text-align:center;
  letter-spacing:4px;
  border-bottom:1px solid #60442f;
  padding-bottom:12px;
}

.queueGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:18px;
}

.card{
  background:#17100c;
  border:1px solid #60442f;
  padding:8px;
}

.card img{
  display:block;
  width:100%;
}

.card button{
  margin-top:8px;
  font-size:14px;
  padding:9px;
}

@media(max-width:600px){
  body{padding:12px}
  h1{font-size:25px}
  .settings{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="panel">

<h1>HALTE PLANTSOEN</h1>

<div class="sub">
HALLOWEEN · 23 OKTOBER 2026
</div>

<div class="controls">

<input id="files" type="file" accept="image/*" multiple>

<label class="pick" for="files">
KIES FOTO'S VAN JE SAMSUNG
</label>

<div class="settings">

<label>
Titel
<input id="titleInput" value="HALTE PLANTSOEN">
</label>

<label>
Ondertitel
<input id="dateInput" value="HALLOWEEN · 23 OKTOBER 2026">
</label>

</div>

<div id="status">
Kies één of meer foto's.
</div>

</div>

<div id="previewWrap">

<div class="preview">
<canvas id="canvas"></canvas>
</div>

<div class="actions">
<button id="save">IN WACHTRIJ ZETTEN</button>
<button id="clear">ANNULEREN</button>
</div>

</div>

</div>

<section id="queue">

<h2>✦ WACHTRIJ ✦</h2>

<div id="queueGrid" class="queueGrid"></div>

</section>


<script>

const filesInput=document.getElementById("files");
const statusEl=document.getElementById("status");
const previewWrap=document.getElementById("previewWrap");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const saveBtn=document.getElementById("save");
const clearBtn=document.getElementById("clear");

const titleInput=document.getElementById("titleInput");
const dateInput=document.getElementById("dateInput");

const queueGrid=document.getElementById("queueGrid");

let currentImage=null;
let currentFileName="";
let queue=[];


/* =========================================================
   FOTO KIEZEN
========================================================= */

filesInput.addEventListener("change",function(){

  if(!this.files.length)return;

  const file=this.files[0];

  currentFileName=file.name;

  const url=URL.createObjectURL(file);
  const img=new Image();

  img.onload=function(){

    currentImage=img;

    makeOldPhoto(img);

    previewWrap.style.display="block";

    statusEl.textContent=
      "Foto klaar om te bekijken: "+file.name;

    URL.revokeObjectURL(url);
  };

  img.src=url;

});


/* =========================================================
   OUDE FOTO
========================================================= */

function makeOldPhoto(img){

  const maxWidth=1100;

  let w=img.naturalWidth;
  let h=img.naturalHeight;

  if(w>maxWidth){
    h=Math.round(h*maxWidth/w);
    w=maxWidth;
  }

  const border=Math.round(w*.075);
  const paperHeight=Math.round(w*.255);

  const outW=w+border*2;
  const outH=h+border*2+paperHeight;

  canvas.width=outW;
  canvas.height=outH;

  ctx.clearRect(0,0,outW,outH);


  /* -------------------------------------------------------
     OUDE DONKERE FOTOPAPIER ACHTERGROND
  ------------------------------------------------------- */

  const bg=ctx.createLinearGradient(0,0,0,outH);

  bg.addColorStop(0,"#35261b");
  bg.addColorStop(.5,"#241810");
  bg.addColorStop(1,"#120c08");

  ctx.fillStyle=bg;
  ctx.fillRect(0,0,outW,outH);


  /* -------------------------------------------------------
     FOTO
  ------------------------------------------------------- */

  const px=border;
  const py=border;

  ctx.drawImage(img,px,py,w,h);


  /* -------------------------------------------------------
     ECHT OUDE FOTO FILTER
  ------------------------------------------------------- */

  const data=ctx.getImageData(px,py,w,h);
  const p=data.data;

  for(let i=0;i<p.length;i+=4){

    let r=p[i];
    let g=p[i+1];
    let b=p[i+2];

    /*
      Luminantie.
      Hierdoor krijgt de foto het karakter van
      ouder fotografisch materiaal.
    */

    const lum=
      .299*r+
      .587*g+
      .114*b;


    /*
      Minder moderne kleur,
      maar NIET volledig sepia.
    */

    const colour=.68;

    r=lum+(r-lum)*colour;
    g=lum+(g-lum)*colour;
    b=lum+(b-lum)*colour;


    /*
      Warme, vergeelde oude emulsie.
    */

    r=r*1.08+7;
    g=g*1.00+3;
    b=b*.88;


    /*
      Lichte vervaging van contrast.
    */

    r=128+(r-128)*.88;
    g=128+(g-128)*.88;
    b=128+(b-128)*.88;


    /*
      Oude filmkorrel.
    */

    const grain=(Math.random()-.5)*15;

    r+=grain;
    g+=grain;
    b+=grain;


    /*
      Verweerde donkere hoeken.
    */

    const xx=(i/4)%w;
    const yy=Math.floor((i/4)/w);

    const dx=(xx-w/2)/(w/2);
    const dy=(yy-h/2)/(h/2);

    const distance=Math.sqrt(dx*dx+dy*dy);

    if(distance>.62){

      const dark=(distance-.62)*35;

      r-=dark;
      g-=dark;
      b-=dark;
    }


    p[i]=Math.max(0,Math.min(255,r));
    p[i+1]=Math.max(0,Math.min(255,g));
    p[i+2]=Math.max(0,Math.min(255,b));
  }

  ctx.putImageData(data,px,py);


  /* -------------------------------------------------------
     OUDE GELE LICHTWAAS
  ------------------------------------------------------- */

  ctx.save();

  const warm=ctx.createRadialGradient(
    px+w*.45,
    py+h*.35,
    20,
    px+w*.5,
    py+h*.5,
    Math.max(w,h)*.8
  );

  warm.addColorStop(0,"rgba(255,235,185,.06)");
  warm.addColorStop(.55,"rgba(160,105,45,.02)");
  warm.addColorStop(1,"rgba(35,18,8,.30)");

  ctx.fillStyle=warm;
  ctx.fillRect(px,py,w,h);

  ctx.restore();


  /* -------------------------------------------------------
     STOF / VLEKKEN OP DE FOTO
  ------------------------------------------------------- */

  ctx.save();

  for(let i=0;i<55;i++){

    const x=px+Math.random()*w;
    const y=py+Math.random()*h;

    const r=Math.random()*2.8+.4;

    ctx.fillStyle=
      Math.random()>.45
      ?"rgba(235,218,180,.18)"
      :"rgba(45,25,12,.20)";

    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();


  /* -------------------------------------------------------
     KRASSEN
  ------------------------------------------------------- */

  ctx.save();

  ctx.globalAlpha=.18;

  for(let i=0;i<16;i++){

    const x=px+Math.random()*w;
    const y=py+Math.random()*h;

    ctx.strokeStyle=
      Math.random()>.5
      ?"rgba(255,242,205,.8)"
      :"rgba(40,20,10,.7)";

    ctx.lineWidth=Math.random()*1.2+.3;

    ctx.beginPath();

    ctx.moveTo(x,y);

    ctx.lineTo(
      x+(Math.random()-.5)*10,
      y+20+Math.random()*120
    );

    ctx.stroke();
  }

  ctx.restore();


  /* -------------------------------------------------------
     FOTO RAND
  ------------------------------------------------------- */

  ctx.strokeStyle="rgba(28,17,11,.95)";
  ctx.lineWidth=Math.max(5,border*.22);

  ctx.strokeRect(px,py,w,h);


  /* -------------------------------------------------------
     PAPIEREN ONDERSTUK
  ------------------------------------------------------- */

  const paperY=py+h;

  const paper=ctx.createLinearGradient(
    0,paperY,
    0,outH
  );

  paper.addColorStop(0,"#cbb386");
  paper.addColorStop(.45,"#bca477");
  paper.addColorStop(1,"#806546");

  ctx.fillStyle=paper;

  ctx.beginPath();

  ctx.moveTo(0,paperY);

  /*
    Bovenrand licht onregelmatig.
  */

  for(let x=0;x<=outW;x+=18){

    ctx.lineTo(
      x,
      paperY+(Math.random()*4-2)
    );
  }

  /*
    Onderkant afgesleten.
  */

  for(let x=outW;x>=0;x-=18){

    ctx.lineTo(
      x,
      outH-(Math.random()*9)
    );
  }

  ctx.closePath();
  ctx.fill();


  /* -------------------------------------------------------
     OUDE PAPIERVLEKKEN
  ------------------------------------------------------- */

  ctx.save();

  for(let i=0;i<24;i++){

    const x=Math.random()*outW;
    const y=paperY+Math.random()*paperHeight;

    const rx=5+Math.random()*22;
    const ry=3+Math.random()*13;

    ctx.fillStyle=
      Math.random()>.5
      ?"rgba(65,39,20,.12)"
      :"rgba(245,225,175,.12)";

    ctx.beginPath();

    ctx.ellipse(
      x,y,rx,ry,
      Math.random()*Math.PI,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.restore();


  /* -------------------------------------------------------
     VICTORIAANSE LIJNEN
  ------------------------------------------------------- */

  drawDecoration(
    border*.7,
    paperY+paperHeight*.68,
    1
  );

  drawDecoration(
    outW-border*.7,
    paperY+paperHeight*.68,
    -1
  );


  /* -------------------------------------------------------
     TITEL
  ------------------------------------------------------- */

  ctx.textAlign="center";

  const titleSize=
    Math.max(23,Math.min(55,w*.065));

  ctx.font=
    "bold "+titleSize+"px Georgia";

  ctx.fillStyle="#291a11";

  ctx.fillText(
    titleInput.value||"HALTE PLANTSOEN",
    outW/2,
    paperY+paperHeight*.43
  );


  /* -------------------------------------------------------
     DATUM
  ------------------------------------------------------- */

  const dateSize=
    Math.max(12,Math.min(22,w*.025));

  ctx.font=
    dateSize+"px Georgia";

  ctx.fillStyle="#3b281a";

  ctx.fillText(
    dateInput.value||"HALLOWEEN · 23 OKTOBER 2026",
    outW/2,
    paperY+paperHeight*.67
  );


  /* -------------------------------------------------------
     BUITENSTE BESCHADIGDE RAND
  ------------------------------------------------------- */

  ctx.strokeStyle="rgba(12,7,4,.95)";
  ctx.lineWidth=4;

  ctx.strokeRect(
    3,
    3,
    outW-6,
    outH-6
  );

}


/* =========================================================
   VICTORIAANSE DECORATIE
========================================================= */

function drawDecoration(x,y,side){

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(side,1);

  ctx.strokeStyle="rgba(50,29,18,.78)";
  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(0,0);

  ctx.bezierCurveTo(
    15,-17,
    22,11,
    36,-3
  );

  ctx.bezierCurveTo(
    49,-18,
    54,12,
    68,-1
  );

  ctx.stroke();


  ctx.beginPath();
  ctx.arc(18,-7,5,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(51,-8,4,0,Math.PI*2);
  ctx.stroke();

  ctx.restore();
}


/* =========================================================
   TEKST LIVE AANPASSEN
========================================================= */

titleInput.addEventListener("input",function(){

  if(currentImage)makeOldPhoto(currentImage);

});

dateInput.addEventListener("input",function(){

  if(currentImage)makeOldPhoto(currentImage);

});


/* =========================================================
   WACHTRIJ
========================================================= */

saveBtn.addEventListener("click",function(){

  if(!currentImage)return;

  queue.push({
    image:canvas.toDataURL("image/jpeg",.94),
    name:currentFileName
  });

  renderQueue();

  statusEl.textContent=
    "Foto staat in de wachtrij.";

});


function renderQueue(){

  queueGrid.innerHTML="";

  queue.forEach(function(item,index){

    const card=document.createElement("div");

    card.className="card";

    const image=document.createElement("img");

    image.src=item.image;

    const remove=document.createElement("button");

    remove.textContent="UIT WACHTRIJ HALEN";

    remove.onclick=function(){

      queue.splice(index,1);

      renderQueue();

    };

    card.appendChild(image);
    card.appendChild(remove);

    queueGrid.appendChild(card);

  });

}


/* =========================================================
   ANNULEREN
========================================================= */

clearBtn.addEventListener("click",function(){

  currentImage=null;
  currentFileName="";
  filesInput.value="";

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  previewWrap.style.display="none";

  statusEl.textContent=
    "Kies één of meer foto's.";

});

</script>

</body>
</html>
