<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Halte Plantsoen - Fotowachtrij</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#0c0806;
  color:#ead7b0;
  font-family:Georgia,"Times New Roman",serif;
}

body{
  padding:20px;
}

h1{
  margin:0;
  text-align:center;
  font-size:32px;
  letter-spacing:4px;
  color:#ead7b0;
  text-shadow:2px 2px 0 #21140e;
}

.sub{
  text-align:center;
  margin:6px 0 25px;
  letter-spacing:2px;
  font-size:15px;
}

.panel{
  max-width:900px;
  margin:auto;
}

.controls{
  background:#17100d;
  border:1px solid #70533b;
  padding:18px;
  box-shadow:0 0 25px #000;
}

label.pick,
button{
  display:block;
  width:100%;
  border:1px solid #9a744d;
  background:#302016;
  color:#f1dfb7;
  padding:14px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:16px;
  text-align:center;
  cursor:pointer;
  margin-top:10px;
}

label.pick:hover,
button:hover{
  background:#493020;
}

input[type=file]{
  display:none;
}

.settings{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.settings label{
  font-size:13px;
  letter-spacing:1px;
}

.settings input{
  width:100%;
  margin-top:5px;
  padding:10px;
  background:#0c0806;
  color:#ead7b0;
  border:1px solid #60462f;
  font-family:Georgia,"Times New Roman",serif;
}

#status{
  text-align:center;
  margin:15px 0;
  color:#c9b18a;
}

#previewWrap{
  display:none;
  margin-top:25px;
}

.preview{
  width:100%;
  background:#090605;
  padding:10px;
  border:1px solid #59402d;
  box-shadow:0 0 30px #000;
}

canvas{
  display:block;
  width:100%;
  height:auto;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

#queue{
  margin:35px auto 0;
  max-width:900px;
}

#queue h2{
  text-align:center;
  letter-spacing:4px;
  font-size:22px;
  border-bottom:1px solid #60462f;
  padding-bottom:12px;
}

.queueGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:18px;
}

.card{
  background:#17100d;
  border:1px solid #60462f;
  padding:8px;
}

.card img{
  display:block;
  width:100%;
  height:auto;
}

.card button{
  margin:8px 0 0;
  font-size:14px;
  padding:9px;
}

.hint{
  font-size:12px;
  color:#9f8a6c;
  text-align:center;
  margin-top:10px;
}

@media(max-width:600px){
  body{padding:12px}
  h1{font-size:25px}
  .settings{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="panel">

<h1>HALTE PLANTSOEN</h1>

<div class="sub">
HALLOWEEN · 23 OKTOBER 2026
</div>

<div class="controls">

<input id="files" type="file" accept="image/*" multiple>

<label class="pick" for="files">
KIES FOTO'S VAN JE SAMSUNG
</label>

<div class="settings">

<label>
Titel
<input id="titleInput" value="HALTE PLANTSOEN">
</label>

<label>
Ondertitel
<input id="dateInput" value="HALLOWEEN · 23 OKTOBER 2026">
</label>

</div>

<div id="status">
Kies één of meer foto's.
</div>

</div>

<div id="previewWrap">

<div class="preview">
<canvas id="canvas"></canvas>
</div>

<div class="actions">
<button id="save">IN WACHTRIJ ZETTEN</button>
<button id="clear">ANNULEREN</button>
</div>

<div class="hint">
De foto wordt eerst als oude gevonden foto verwerkt.
</div>

</div>

</div>

<section id="queue">

<h2>✦ WACHTRIJ ✦</h2>

<div id="queueGrid" class="queueGrid"></div>

</section>


<script>

const filesInput = document.getElementById("files");
const statusEl = document.getElementById("status");
const previewWrap = document.getElementById("previewWrap");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const saveBtn = document.getElementById("save");
const clearBtn = document.getElementById("clear");

const titleInput = document.getElementById("titleInput");
const dateInput = document.getElementById("dateInput");

const queueGrid = document.getElementById("queueGrid");

let currentImage = null;
let currentFileName = "";
let queue = [];


/* =========================================================
   FOTO KIEZEN
========================================================= */

filesInput.addEventListener("change", function(){

  if(!this.files || !this.files.length) return;

  const file = this.files[0];

  currentFileName = file.name;

  const url = URL.createObjectURL(file);

  const img = new Image();

  img.onload = function(){

    currentImage = img;

    makeOldPhoto(img);

    previewWrap.style.display = "block";

    statusEl.textContent =
      "Foto klaar om te bekijken: " + file.name;

    URL.revokeObjectURL(url);
  };

  img.src = url;

});


/* =========================================================
   OUDE FOTO / POSTER
========================================================= */

function makeOldPhoto(img){

  const maxWidth = 1000;

  let w = img.naturalWidth;
  let h = img.naturalHeight;

  if(w > maxWidth){
    h = Math.round(h * maxWidth / w);
    w = maxWidth;
  }

  /*
    Ruimte rondom de foto.
    Onderaan extra ruimte voor het oude papieren tekstgedeelte.
  */

  const border = Math.round(w * 0.055);

  const paperHeight = Math.round(w * 0.24);

  const outW = w + border * 2;
  const outH = h + border * 2 + paperHeight;

  canvas.width = outW;
  canvas.height = outH;

  ctx.clearRect(0,0,outW,outH);


  /* ---------------------------------------------------------
     OUDE PAPIEREN ACHTERGROND
  --------------------------------------------------------- */

  const paper = ctx.createLinearGradient(0,0,0,outH);

  paper.addColorStop(0,"#8b7355");
  paper.addColorStop(.45,"#b19a72");
  paper.addColorStop(1,"#725c43");

  ctx.fillStyle = paper;
  ctx.fillRect(0,0,outW,outH);


  /* ---------------------------------------------------------
     ONREGELMATIGE DONKERE RAND
  --------------------------------------------------------- */

  ctx.save();

  ctx.fillStyle = "#211710";

  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(outW,0);
  ctx.lineTo(outW,outH);
  ctx.lineTo(0,outH);
  ctx.closePath();
  ctx.fill();

  ctx.restore();


  /*
    Oude foto iets naar binnen.
  */

  const px = border;
  const py = border;

  ctx.save();

  ctx.beginPath();
  ctx.rect(px,py,w,h);
  ctx.clip();

  /*
    Eerst originele foto.
    We houden de kleuren bewust zichtbaar.
  */

  ctx.filter =
    "sepia(18%) contrast(108%) saturate(78%) brightness(92%)";

  ctx.drawImage(img,px,py,w,h);

  ctx.filter = "none";


  /* ---------------------------------------------------------
     LICHTE OUDE FOTO TEXTUUR
  --------------------------------------------------------- */

  const shade = ctx.createRadialGradient(
    px+w/2,
    py+h/2,
    Math.min(w,h)*.15,
    px+w/2,
    py+h/2,
    Math.max(w,h)*.75
  );

  shade.addColorStop(0,"rgba(255,240,205,0)");
  shade.addColorStop(.65,"rgba(40,20,10,.05)");
  shade.addColorStop(1,"rgba(15,8,5,.38)");

  ctx.fillStyle = shade;
  ctx.fillRect(px,py,w,h);


  /* ---------------------------------------------------------
     OUDE KRASJES
  --------------------------------------------------------- */

  ctx.globalAlpha = .22;
  ctx.strokeStyle = "#f3e3c0";
  ctx.lineWidth = 1;

  for(let i=0;i<18;i++){

    const x = px + Math.random()*w;
    const y = py + Math.random()*h;

    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(
      x + (Math.random()*12-6),
      y + Math.random()*90
    );
    ctx.stroke();
  }

  ctx.globalAlpha = 1;

  ctx.restore();


  /* ---------------------------------------------------------
     DONKERE FOTO-RAND
  --------------------------------------------------------- */

  ctx.strokeStyle = "#302017";
  ctx.lineWidth = Math.max(5,border*.32);

  ctx.strokeRect(
    px,
    py,
    w,
    h
  );


  /* ---------------------------------------------------------
     PAPIEREN STROOK ONDERAAN
  --------------------------------------------------------- */

  const paperY = border + h;

  const bottomPaper = ctx.createLinearGradient(
    0,
    paperY,
    0,
    outH
  );

  bottomPaper.addColorStop(0,"#d0b98c");
  bottomPaper.addColorStop(.5,"#bda478");
  bottomPaper.addColorStop(1,"#967b56");

  ctx.fillStyle = bottomPaper;

  ctx.beginPath();

  ctx.moveTo(0,paperY);
  ctx.lineTo(outW,paperY);

  /*
    licht onregelmatige onderkant
  */

  for(let x=outW;x>=0;x-=25){
    ctx.lineTo(
      x,
      outH - Math.random()*8
    );
  }

  ctx.closePath();
  ctx.fill();


  /* ---------------------------------------------------------
     PAPIER VLEKKEN
  --------------------------------------------------------- */

  ctx.globalAlpha=.13;

  for(let i=0;i<18;i++){

    const x=Math.random()*outW;
    const y=paperY+Math.random()*paperHeight;

    const r=5+Math.random()*25;

    ctx.fillStyle="#4a3020";

    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  }

  ctx.globalAlpha=1;


  /* ---------------------------------------------------------
     TITEL
  --------------------------------------------------------- */

  ctx.textAlign="center";

  const titleSize =
    Math.max(22,Math.min(55,w*.065));

  ctx.font =
    "bold " + titleSize +
    "px Georgia";

  ctx.fillStyle="#291b13";

  ctx.shadowColor="rgba(255,230,180,.25)";
  ctx.shadowBlur=1;

  ctx.fillText(
    titleInput.value || "HALTE PLANTSOEN",
    outW/2,
    paperY + paperHeight*.43
  );

  ctx.shadowBlur=0;


  /* ---------------------------------------------------------
     ONDERTITEL
  --------------------------------------------------------- */

  const dateSize =
    Math.max(12,Math.min(22,w*.025));

  ctx.font =
    dateSize + "px Georgia";

  ctx.fillStyle="#39251a";

  ctx.fillText(
    dateInput.value || "HALLOWEEN · 23 OKTOBER 2026",
    outW/2,
    paperY + paperHeight*.68
  );


  /* ---------------------------------------------------------
     VICTORIAANSE HOEKORNAMENTEN
  --------------------------------------------------------- */

  drawOrnament(
    border*.8,
    paperY + paperHeight*.72,
    1
  );

  drawOrnament(
    outW-border*.8,
    paperY + paperHeight*.72,
    -1
  );


  /* ---------------------------------------------------------
     OUDE KRABBELS / LIJNTJES
  --------------------------------------------------------- */

  ctx.strokeStyle="rgba(47,29,19,.55)";
  ctx.lineWidth=1;

  ctx.beginPath();

  ctx.moveTo(border*.55,paperY+10);
  ctx.bezierCurveTo(
    border*1.5,
    paperY+paperHeight*.2,
    border*.2,
    paperY+paperHeight*.4,
    border*1.3,
    paperY+paperHeight*.55
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(outW-border*.55,paperY+10);
  ctx.bezierCurveTo(
    outW-border*1.5,
    paperY+paperHeight*.2,
    outW-border*.2,
    paperY+paperHeight*.4,
    outW-border*1.3,
    paperY+paperHeight*.55
  );

  ctx.stroke();


  /* ---------------------------------------------------------
     BESCHADIGDE RAND
  --------------------------------------------------------- */

  ctx.strokeStyle="rgba(20,10,6,.7)";
  ctx.lineWidth=2;

  ctx.strokeRect(
    3,
    3,
    outW-6,
    outH-6
  );

}


/* =========================================================
   ORNAMENT
========================================================= */

function drawOrnament(x,y,side){

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(side,1);

  ctx.strokeStyle="rgba(45,27,18,.75)";
  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(0,0);

  ctx.bezierCurveTo(
    18,-18,
    28,12,
    42,-5
  );

  ctx.bezierCurveTo(
    54,-20,
    57,14,
    72,0
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.arc(18,-8,5,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();

  ctx.arc(57,-8,4,0,Math.PI*2);
  ctx.stroke();

  ctx.restore();
}


/* =========================================================
   TITEL AANPASSEN
========================================================= */

titleInput.addEventListener("input",function(){

  if(currentImage){
    makeOldPhoto(currentImage);
  }

});

dateInput.addEventListener("input",function(){

  if(currentImage){
    makeOldPhoto(currentImage);
  }

});


/* =========================================================
   IN WACHTRIJ
========================================================= */

saveBtn.addEventListener("click",function(){

  if(!currentImage) return;

  const imageData =
    canvas.toDataURL("image/jpeg",.94);

  queue.push({
    image:imageData,
    name:currentFileName
  });

  renderQueue();

  statusEl.textContent =
    "Foto staat in de wachtrij.";

});


/* =========================================================
   WACHTRIJ TONEN
========================================================= */

function renderQueue(){

  queueGrid.innerHTML="";

  queue.forEach(function(item,index){

    const card=document.createElement("div");

    card.className="card";

    const img=document.createElement("img");

    img.src=item.image;

    const remove=document.createElement("button");

    remove.textContent="UIT WACHTRIJ HALEN";

    remove.onclick=function(){

      queue.splice(index,1);

      renderQueue();

    };

    card.appendChild(img);
    card.appendChild(remove);

    queueGrid.appendChild(card);

  });

}


/* =========================================================
   ANNULEREN
========================================================= */

clearBtn.addEventListener("click",function(){

  currentImage=null;
  currentFileName="";
  filesInput.value="";

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  previewWrap.style.display="none";

  statusEl.textContent=
    "Kies één of meer foto's.";

});


</script>

</body>
</html>
