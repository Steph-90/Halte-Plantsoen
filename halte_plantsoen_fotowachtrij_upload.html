<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halte Plantsoen — Fotowachtrij</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#17130f;
  color:#eee4d2;
  font-family:Georgia,"Times New Roman",serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 0%,#3a2a1c 0,#17130f 48%,#0d0b09 100%);
}

main{
  width:min(1000px,94%);
  margin:0 auto;
  padding:24px 0 50px;
}

header{
  text-align:center;
  margin-bottom:22px;
}

header h1{
  margin:0;
  font-size:clamp(30px,7vw,62px);
  letter-spacing:3px;
  color:#d8c49b;
  text-shadow:
    0 2px 0 #2b1b12,
    0 4px 12px #000;
}

header p{
  margin:7px 0 0;
  color:#a89576;
  font-size:15px;
  letter-spacing:2px;
}

.pick{
  display:block;
  width:100%;
  padding:17px 20px;
  text-align:center;
  cursor:pointer;
  border:1px solid #786143;
  background:
    linear-gradient(#3b2b1d,#241910);
  color:#e7d5ae;
  font-weight:bold;
  letter-spacing:1px;
  box-shadow:
    inset 0 0 0 2px #17100b,
    0 5px 18px #000;
}

.pick:hover{
  background:linear-gradient(#493522,#2b1d12);
}

input[type=file]{
  display:none;
}

#status{
  text-align:center;
  margin:13px 0 18px;
  color:#aa9a81;
  font-size:14px;
}

#previewWrap{
  display:none;
  margin-bottom:35px;
}

.previewBox{
  position:relative;
  padding:12px;
  background:#0d0a08;
  border:1px solid #58452e;
  box-shadow:0 10px 30px #000;
}

canvas{
  display:block;
  width:100%;
  height:auto;
  background:#111;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:12px;
}

button{
  flex:1;
  border:1px solid #6c5738;
  background:#302115;
  color:#ead9b7;
  padding:14px 10px;
  font-family:Georgia,"Times New Roman",serif;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#493522;
}

#queue{
  margin-top:30px;
}

#queue h2{
  text-align:center;
  font-size:28px;
  letter-spacing:2px;
  color:#cbb58c;
  margin-bottom:18px;
}

.queueGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:15px;
}

.card{
  background:#211811;
  border:1px solid #58452e;
  padding:8px;
  box-shadow:0 7px 18px #000;
}

.card img{
  display:block;
  width:100%;
  height:auto;
}

.cardInfo{
  padding:9px 3px 3px;
  color:#a99a82;
  font-size:12px;
  text-align:center;
}

/* kleine ouderwetse sierlijnen */
.ornament{
  text-align:center;
  color:#88704c;
  font-size:25px;
