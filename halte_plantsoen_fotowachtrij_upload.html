<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halte Plantsoen - Fotowachtrij</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#0c0806;
  color:#ead7b0;
  font-family:Georgia,"Times New Roman",serif;
}

body{
  background:
    radial-gradient(circle at 50% 0,#3a2818 0,#160e09 48%,#070504 100%);
}

main{
  width:min(1000px,94%);
  margin:auto;
  padding:22px 0 50px;
}

header{
  text-align:center;
  margin-bottom:24px;
}

.orn{
  color:#a67c45;
  font-size:25px;
  letter-spacing:10px;
}

header h1{
  margin:5px 0 8px;
  color:#d9bd86;
  font-size:clamp(34px,8vw,68px);
  letter-spacing:3px;
  line-height:1;
  text-shadow:3px 4px #211109,0 8px 20px #000;
}

header p{
  margin:0;
  color:#b89b6b;
  font-size:15px;
  letter-spacing:3px;
}

#files{
  position:absolute;
  width:1px;
  height:1px;
  opacity:0;
}

.pick{
  display:block;
  padding:18px;
  text-align:center;
  cursor:pointer;
  color:#ead4aa;
  font-size:18px;
  font-weight:bold;
  background:linear-gradient(#4a321e,#21130b);
  border:2px solid #80603a;
  box-shadow:inset 0 0 0 3px #140b06,0 8px 20px #000;
}

#status{
  text-align:center;
  margin:13px 0 20px;
  color:#ad9875;
}

#previewWrap{
  display:none;
}

.preview{
  padding:10px;
  background:#080604;
  border:1px solid #745331;
  box-shadow:0 12px 35px #000;
}

canvas{
  display:block;
  width:100%;
  height:auto;
}

.actions{
  display:flex;
  gap:12px;
  margin-top:14px;
}

button{
  flex:1;
  padding:16px;
  color:#ead4aa;
  background:linear-gradient(#49311d,#21130b);
  border:2px solid #80603a;
  font:bold 17px Georgia,serif;
}

#queue{
  margin-top:40px;
}

#queue h2{
  text-align:center;
  color:#d0b37d;
  font-size:30px;
  letter-spacing:3px;
}

.queueGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:15px;
}

.card{
  background:#17100b;
  padding:8px;
  border:1px solid #65482b;
}

.card img{
  width:100%;
  display:block;
}

.cardInfo{
  text-align:center;
  padding:8px;
  color:#a18c6b;
  font-size:12px;
}

@media(max-width:600px){
  .actions{flex-direction:column}
}
</style>
</head>

<body>

<main>

<header>
  <div class="orn">✦ ❦ ✦</div>
  <h1>HALTE PLANTSOEN</h1>
  <p>HALLOWEEN · 23 OKTOBER 2026</p>
</header>

<input id="files" type="file" accept="image/*" multiple>

<label class="pick" for="files">
  KIES FOTO'S VAN JE SAMSUNG
</label>

<div id="status">
  Kies één of meer foto's.
</div>

<div id="previewWrap">

  <div class="preview">
    <canvas id="canvas"></canvas>
  </div>

  <div class="actions">
    <button id="save">IN WACHTRIJ ZETTEN</button>
    <button id="clear">ANNULEREN</button>
  </div>

</div>

<section id="queue">
  <h2>✦ WACHTRIJ ✦</h2>
  <div id="queueGrid" class="queueGrid"></div>
</section>

</main>

<script>

const filesInput=document.getElementById("files");
const statusEl=document.getElementById("status");
const wrap=document.getElementById("previewWrap");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const queueGrid=document.getElementById("queueGrid");
const saveBtn=document.getElementById("save");
const clearBtn=document.getElementById("clear");

let processed=[];


/* FOTO KIEZEN */

filesInput.addEventListener("change",async()=>{

  const files=[...filesInput.files];

  if(!files.length)return;

  statusEl.textContent="Foto wordt verwerkt...";

  processed=[];

  for(const file of files){

    const img=await loadImage(file);

    processed.push(makeOldPhoto(img));

  }

  show(processed[0]);

  wrap.style.display="block";

  statusEl.textContent=
    processed.length===1
      ?"Foto klaar om te bekijken."
      :processed.length+" foto's klaar.";

});


/* FOTO LADEN */

function loadImage(file){

  return new Promise((resolve,reject)=>{

    const url=URL.createObjectURL(file);
    const img=new Image();

    img.onload=()=>{
      URL.revokeObjectURL(url);
      resolve(img);
    };

    img.onerror=reject;
    img.src=url;

  });

}


/* TONEN */

function show(img){

  canvas.width=img.width;
  canvas.height=img.height;

  ctx.clearRect(
    0,0,
    canvas.width,
    canvas.height
  );

  ctx.drawImage(img,0,0);

}


/* =========================================================
   OUDE FOTO / POSTER
========================================================= */

function makeOldPhoto(img){

  let w=img.naturalWidth;
  let h=img.naturalHeight;

  const max=1600;

  if(w>max){

    const scale=max/w;

    w=Math.round(w*scale);
    h=Math.round(h*scale);

  }


  /*
     De poster is maar iets hoger dan de originele foto.
     Daardoor blijft de foto groot.
  */

  const outer=22;

  const bottom=Math.round(h*.19);

  const totalH=h+bottom;


  const c=document.createElement("canvas");

  c.width=w+outer*2;
  c.height=totalH+outer*2;

  const x=c.getContext("2d");


  /* =======================================================
     OUDE DONKERE BASIS
  ======================================================= */

  x.fillStyle="#3b2413";

  x.fillRect(
    0,
    0,
    c.width,
    c.height
  );


  /*
     oude papierkleur langs de rand
  */

  x.fillStyle="#9c7140";

  x.fillRect(
    outer,
    outer,
    w,
    totalH
  );


  /* =======================================================
     FOTO
  ======================================================= */

  x.drawImage(
    img,
    outer,
    outer,
    w,
    h
  );


  /* =======================================================
     KLEUR: OUDER, MAAR NIET BRUIN
  ======================================================= */

  const pixels=x.getImageData(
    outer,
    outer,
    w,
    h
  );

  const d=pixels.data;


  for(let i=0;i<d.length;i+=4){

    let r=d[i];
    let g=d[i+1];
    let b=d[i+2];


    /*
       lichte warme emulsie
    */

    r=r*1.035;
    g=g*.99;
    b=b*.94;


    /*
       iets minder moderne kleur
    */

    const grey=(r+g+b)/3;

    r=r*.90+grey*.10;
    g=g*.90+grey*.10;
    b=b*.90+grey*.10;


    /*
       oud contrast
    */

    r=(r-128)*1.07+128;
    g=(g-128)*1.07+128;
    b=(b-128)*1.07+128;


    d[i]=Math.max(0,Math.min(255,r));
    d[i+1]=Math.max(0,Math.min(255,g));
    d[i+2]=Math.max(0,Math.min(255,b));

  }


  x.putImageData(
    pixels,
    outer,
    outer
  );


  /* =======================================================
     ZACHTE OUDE FOTO-VIGNET
  ======================================================= */

  const vignette=x.createRadialGradient(
    c.width/2,
    outer+h*.48,
    Math.min(w,h)*.25,
    c.width/2,
    outer+h*.48,
    Math.max(w,h)*.72
  );

  vignette.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );

  vignette.addColorStop(
    .72,
    "rgba(35,15,5,.03)"
  );

  vignette.addColorStop(
    1,
    "rgba(8,3,1,.48)"
  );

  x.fillStyle=vignette;

  x.fillRect(
    outer,
    outer,
    w,
    h
  );


  /* =======================================================
     FILMGRAIN
  ======================================================= */

  x.save();

  for(let i=0;i<6500;i++){

    const px=outer+Math.random()*w;
    const py=outer+Math.random()*h;

    const a=.018+Math.random()*.055;

    x.fillStyle=
      Math.random()>.5
        ?`rgba(255,238,195,${a})`
        :`rgba(15,5,1,${a})`;

    x.fillRect(
      px,
      py,
      Math.random()<.9?1:2,
      Math.random()<.9?1:2
    );

  }

  x.restore();


  /* =======================================================
     LICHTE OUDE VLEKKEN
  ======================================================= */

  x.save();

  for(let i=0;i<28;i++){

    const px=outer+Math.random()*w;
    const py=outer+Math.random()*h;
    const r=8+Math.random()*50;

    const stain=x.createRadialGradient(
      px,py,0,
      px,py,r
    );

    stain.addColorStop(
      0,
      "rgba(75,38,12,.11)"
    );

    stain.addColorStop(
      1,
      "rgba(75,38,12,0)"
    );

    x.fillStyle=stain;

    x.beginPath();

    x.arc(
      px,
      py,
      r,
      0,
      Math.PI*2
    );

    x.fill();

  }

  x.restore();


  /* =======================================================
     SCHEUREN
  ======================================================= */

  x.save();

  x.globalAlpha=.25;

  for(let i=0;i<28;i++){

    const px=outer+Math.random()*w;
    const py=outer+Math.random()*h;

    x.strokeStyle=
      Math.random()>.5
        ?"rgba(255,235,195,.9)"
        :"rgba(35,12,3,.9)";

    x.lineWidth=Math.random()<.9?1:2;

    x.beginPath();

    x.moveTo(px,py);

    x.lineTo(
      px+15+Math.random()*170,
      py-15+Math.random()*30
    );

    x.stroke();

  }

  x.restore();


  /* =======================================================
     PAPIEREN ONDERDEEL
  ======================================================= */

  const paperY=outer+h;


  const paper=x.createLinearGradient(
    0,
    paperY,
    0,
    paperY+bottom
  );

  paper.addColorStop(
    0,
    "#d0ad75"
  );

  paper.addColorStop(
    .5,
    "#c39b62"
  );

  paper.addColorStop(
    1,
    "#9b7040"
  );

  x.fillStyle=paper;

  x.fillRect(
    outer,
    paperY,
    w,
    bottom
  );


  /* =======================================================
     PAPIERSTRUCTUUR
  ======================================================= */

  x.save();

  for(let i=0;i<5000;i++){

    const px=outer+Math.random()*w;
    const py=paperY+Math.random()*bottom;

    const a=.025+Math.random()*.09;

    x.fillStyle=
      Math.random()>.5
        ?`rgba(255,235,185,${a})`
        :`rgba(60,25,5,${a})`;

    x.fillRect(
      px,
      py,
      1+Math.random()*2,
      1+Math.random()*2
    );

  }

  x.restore();


  /* =======================================================
     PAPIER VLEKKEN
  ======================================================= */

  x.save();

  for(let i=0;i<30;i++){

    const px=outer+Math.random()*w;
    const py=paperY+Math.random()*bottom;
    const r=5+Math.random()*35;

    const stain=x.createRadialGradient(
      px,py,0,
      px,py,r
    );

    stain.addColorStop(
      0,
      "rgba(65,27,5,.20)"
    );

    stain.addColorStop(
      1,
      "rgba(65,27,5,0)"
    );

    x.fillStyle=stain;

    x.beginPath();

    x.arc(
      px,
      py,
      r,
      0,
      Math.PI*2
    );

    x.fill();

  }

  x.restore();


  /* =======================================================
     GROTE TITEL
  ======================================================= */

  x.save();

  x.textAlign="center";
  x.textBaseline="middle";


  const titleSize=Math.max(
    28,
    Math.min(w*.085,88)
  );


  x.font=
    "bold "+
    titleSize+
    "px Georgia,'Times New Roman',serif";


  /*
     oude donkere drukinkt
  */

  x.fillStyle="#3b1e0c";

  x.fillText(
    "HALTE PLANTSOEN",
    c.width/2,
    paperY+bottom*.43
  );


  /*
     lichte slijtage in de letters
  */

  x.globalAlpha=.18;

  x.fillStyle="#d8b67a";

  x.fillText(
    "HALTE PLANTSOEN",
    c.width/2-1,
    paperY+bottom*.43-1
  );


  x.globalAlpha=1;


  /* datum */

  const sub=Math.max(
    13,
    Math.min(w*.028,30)
  );

  x.font=
    "bold "+
    sub+
    "px Georgia,'Times New Roman',serif";

  x.fillStyle="#3b1e0c";

  x.fillText(
    "HALLOWEEN · 23 OKTOBER 2026",
    c.width/2,
    paperY+bottom*.72
  );


  x.restore();


  /* =======================================================
     ONDERSTE ORNAMENTEN
  ======================================================= */

  drawDecoration(
    x,
    outer+35,
    paperY+bottom*.70,
    1
  );

  drawDecoration(
    x,
    outer+w-35,
    paperY+bottom*.70,
    -1
  );


  /* =======================================================
     BUITENSTE OUDE RAND
  ======================================================= */

  x.strokeStyle="#281307";
  x.lineWidth=8;

  x.strokeRect(
    outer/2,
    outer/2,
    c.width-outer,
    c.height-outer
  );


  x.strokeStyle="#d0a96f";
  x.lineWidth=2;

  x.strokeRect(
    8,
    8,
    c.width-16,
    c.height-16
  );


  x.strokeStyle="rgba(50,23,8,.75)";
  x.lineWidth=2;

  x.strokeRect(
    15,
    15,
    c.width-30,
    c.height-30
  );


  /* =======================================================
     AFGESLETEN / GEBROKEN RAND
  ======================================================= */

  x.save();

  for(let i=0;i<85;i++){

    const side=Math.floor(Math.random()*4);

    let px,py;

    if(side===0){
      px=Math.random()*c.width;
      py=3+Math.random()*16;
    }

    if(side===1){
      px=Math.random()*c.width;
      py=c.height-18+Math.random()*16;
    }

    if(side===2){
      px=3+Math.random()*16;
      py=Math.random()*c.height;
    }

    if(side===3){
      px=c.width-18+Math.random()*16;
      py=Math.random()*c.height;
    }

    x.fillStyle=
      Math.random()>.45
        ?"rgba(35,14,4,.75)"
        :"rgba(235,203,151,.45)";

    x.beginPath();

    x.arc(
      px,
      py,
      2+Math.random()*7,
      0,
      Math.PI*2
    );

    x.fill();

  }

  x.restore();


  return c;
}


/* =========================================================
   SIERLIJKE HALLOWEEN DECORATIE
========================================================= */

function drawDecoration(c,x,y,flip){

  c.save();

  c.translate(x,y);
  c.scale(flip,1);

  c.strokeStyle="#3b1d0b";
  c.fillStyle="#3b1d0b";
  c.lineWidth=2;


  /* grote Victoriaanse krul */

  c.beginPath();

  c.moveTo(0,0);

  c.bezierCurveTo(
    25,-28,
    65,-25,
    82,0
  );

  c.bezierCurveTo(
    95,20,
    70,28,
    60,10
  );

  c.bezierCurveTo(
    53,-4,
    70,-8,
    76,5
  );

  c.stroke();


  /* tweede krul */

  c.beginPath();

  c.moveTo(5,8);

  c.bezierCurveTo(
    30,28,
    60,38,
    90,20
  );

  c.stroke();


  /* spinnenweb */

  c.beginPath();

  c.moveTo(8,0);
  c.lineTo(38,28);

  c.moveTo(8,0);
  c.lineTo(50,0);

  c.moveTo(8,0);
  c.lineTo(30,-27);

  c.stroke();


  for(let i=1;i<4;i++){

    c.beginPath();

    c.arc(
      8,
      0,
      i*10,
      -1.1,
      .65
    );

    c.stroke();

  }


  /* klein blad */

  c.beginPath();

  c.ellipse(
    42,
    23,
    10,
    4,
    -.5,
    0,
    Math.PI*2
  );

  c.stroke();


  c.restore();
}


/* =========================================================
   WACHTRIJ
========================================================= */

saveBtn.addEventListener("click",()=>{

  if(!processed.length)return;

  for(const image of processed){

    const data=image.toDataURL(
      "image/jpeg",
      .92
    );

    const card=document.createElement("div");

    card.className="card";

    const imageEl=document.createElement("img");

    imageEl.src=data;

    const info=document.createElement("div");

    info.className="cardInfo";
    info.textContent="Klaar voor beoordeling";

    card.appendChild(imageEl);
    card.appendChild(info);

    queueGrid.prepend(card);
  }

  processed=[];

  wrap.style.display="none";

  filesInput.value="";

  statusEl.textContent=
    "Foto('s) staan nu in de wachtrij.";
});


/* ANNULEREN */

clearBtn.addEventListener("click",()=>{

  processed=[];

  wrap.style.display="none";

  filesInput.value="";

  statusEl.textContent=
    "Kies één of meer foto's.";

});

</script>

</body>
</html>
