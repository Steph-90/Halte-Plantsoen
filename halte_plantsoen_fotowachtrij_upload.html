<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halte Plantsoen - Fotowachtrij</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
background:#0b0806;
color:#ead9b8;
font-family:Georgia,"Times New Roman",serif;
}

body{
background:
radial-gradient(circle at 50% 0,#3a2718,#120c08 48%,#050403);
}

main{
width:min(1000px,94%);
margin:auto;
padding:25px 0 50px;
}

header{
text-align:center;
margin-bottom:25px;
}

.ornament{
font-size:27px;
color:#a27b46;
letter-spacing:10px;
}

h1{
margin:6px 0 8px;
font-size:clamp(34px,9vw,70px);
letter-spacing:3px;
color:#d8bd86;
text-shadow:3px 4px #211109,0 8px 20px #000;
}

header p{
margin:0;
font-size:15px;
letter-spacing:3px;
color:#bda174;
}

#files{
position:absolute;
width:1px;
height:1px;
opacity:0;
}

.pick{
display:block;
padding:18px;
text-align:center;
cursor:pointer;
font-size:18px;
font-weight:bold;
color:#ead3a5;
background:linear-gradient(#4a321d,#21130b);
border:2px solid #80603a;
box-shadow:inset 0 0 0 3px #130b07,0 8px 20px #000;
}

#status{
text-align:center;
margin:14px 0 20px;
color:#aa9674;
}

#previewWrap{
display:none;
}

.preview{
padding:14px;
background:#080604;
border:2px solid #65482b;
box-shadow:0 12px 35px #000;
}

canvas{
display:block;
width:100%;
height:auto;
}

.actions{
display:flex;
gap:12px;
margin-top:14px;
}

button{
flex:1;
padding:16px;
font:bold 17px Georgia,serif;
color:#ead3a5;
background:linear-gradient(#49311d,#21130b);
border:2px solid #80603a;
cursor:pointer;
}

#queue{
margin-top:40px;
}

#queue h2{
text-align:center;
font-size:31px;
letter-spacing:3px;
color:#d0b27a;
}

.queueGrid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
gap:15px;
}

.card{
background:#17100b;
padding:8px;
border:1px solid #65482b;
box-shadow:0 7px 18px #000;
}

.card img{
display:block;
width:100%;
}

.cardInfo{
text-align:center;
padding:8px;
font-size:12px;
color:#9f8968;
}

@media(max-width:600px){
.actions{flex-direction:column}
}
</style>
</head>

<body>

<main>

<header>
<div class="ornament">✦ ❦ ✦</div>
<h1>HALTE PLANTSOEN</h1>
<p>HALLOWEEN · 23 OKTOBER 2026</p>
</header>

<input id="files" type="file" accept="image/*" multiple>

<label class="pick" for="files">
KIES FOTO'S VAN JE SAMSUNG
</label>

<div id="status">
Kies één of meer foto's.
</div>

<div id="previewWrap">

<div class="preview">
<canvas id="canvas"></canvas>
</div>

<div class="actions">
<button id="save">IN WACHTRIJ ZETTEN</button>
<button id="clear">ANNULEREN</button>
</div>

</div>

<section id="queue">
<h2>✦ WACHTRIJ ✦</h2>
<div id="queueGrid" class="queueGrid"></div>
</section>

</main>

<script>

const filesInput=document.getElementById("files");
const statusEl=document.getElementById("status");
const wrap=document.getElementById("previewWrap");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const queueGrid=document.getElementById("queueGrid");
const saveBtn=document.getElementById("save");
const clearBtn=document.getElementById("clear");

let processed=[];


/* FOTO KIEZEN */

filesInput.addEventListener("change",async()=>{

const files=[...filesInput.files];

if(!files.length)return;

statusEl.textContent="Foto wordt verwerkt...";

processed=[];

for(const file of files){

const img=await loadImage(file);

processed.push(makePhoto(img));

}

show(processed[0]);

wrap.style.display="block";

statusEl.textContent=
processed.length===1
?"Foto klaar om te bekijken."
:processed.length+" foto's klaar.";

});


/* FOTO LADEN */

function loadImage(file){

return new Promise((resolve,reject)=>{

const url=URL.createObjectURL(file);
const img=new Image();

img.onload=()=>{
URL.revokeObjectURL(url);
resolve(img);
};

img.onerror=reject;
img.src=url;

});

}


/* FOTO TONEN */

function show(img){

canvas.width=img.width;
canvas.height=img.height;

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

ctx.drawImage(img,0,0);

}


/* =====================================================
   FOTO EFFECT
===================================================== */

function makePhoto(img){

let w=img.naturalWidth;
let h=img.naturalHeight;

const max=1500;

if(w>max){

const schaal=max/w;

w=Math.round(w*schaal);
h=Math.round(h*schaal);

}

const c=document.createElement("canvas");

c.width=w;
c.height=h;

const x=c.getContext("2d");


/* ORIGINELE FOTO */

x.drawImage(
img,
0,
0,
w,
h
);


/* =====================================================
   STERKERE 1913 KLEUR
===================================================== */

const pixels=x.getImageData(
0,
0,
w,
h
);

const d=pixels.data;

for(let i=0;i<d.length;i+=4){

let r=d[i];
let g=d[i+1];
let b=d[i+2];


/* warme oude emulsie */

r=r*1.08+5;
g=g*.94+3;
b=b*.78;


/* minder moderne verzadiging */

const grijs=(r+g+b)/3;

r=r*.82+grijs*.18;
g=g*.82+grijs*.18;
b=b*.82+grijs*.18;


/* contrast */

r=(r-128)*1.12+128;
g=(g-128)*1.12+128;
b=(b-128)*1.12+128;

d[i]=Math.max(0,Math.min(255,r));
d[i+1]=Math.max(0,Math.min(255,g));
d[i+2]=Math.max(0,Math.min(255,b));

}

x.putImageData(pixels,0,0);


/* =====================================================
   PAPIERACHTIGE WAAS
===================================================== */

x.fillStyle="rgba(126,82,39,.12)";
x.fillRect(0,0,w,h);


/* =====================================================
   GROVE FILMKORREL
===================================================== */

x.save();

for(let i=0;i<7000;i++){

const px=Math.random()*w;
const py=Math.random()*h;

const licht=Math.random()>.52;

x.fillStyle=licht
?"rgba(255,235,190,.10)"
:"rgba(20,5,1,.12)";

const grootte=Math.random()<.92?1:2;

x.fillRect(
px,
py,
grootte,
grootte
);

}

x.restore();


/* =====================================================
   OUDE VLEKKEN
===================================================== */

x.save();

for(let i=0;i<35;i++){

const px=Math.random()*w;
const py=Math.random()*h;
const r=10+Math.random()*70;

const vlek=x.createRadialGradient(
px,py,0,
px,py,r
);

vlek.addColorStop(
0,
"rgba(55,25,8,.22)"
);

vlek.addColorStop(
.45,
"rgba(55,25,8,.09)"
);

vlek.addColorStop(
1,
"rgba(55,25,8,0)"
);

x.fillStyle=vlek;

x.beginPath();

x.arc(
px,
py,
r,
0,
Math.PI*2
);

x.fill();

}

x.restore();


/* =====================================================
   OUDE KRASSEN EN SCHEURTJES
===================================================== */

x.save();

x.globalAlpha=.35;

for(let i=0;i<35;i++){

const px=Math.random()*w;
const py=Math.random()*h;

x.strokeStyle=
Math.random()>.5
?"#f1ddb4"
:"#32170a";

x.lineWidth=
Math.random()<.85?1:2;

x.beginPath();

x.moveTo(px,py);

x.lineTo(
px+20+Math.random()*180,
py-10+Math.random()*20
);

x.stroke();

}

x.restore();


/* =====================================================
   ONGELIJKE DONKERE FOTO-RAND
===================================================== */

const v=x.createRadialGradient(
w/2,
h/2,
Math.min(w,h)*.18,
w/2,
h/2,
Math.max(w,h)*.78
);

v.addColorStop(
0,
"rgba(0,0,0,0)"
);

v.addColorStop(
.55,
"rgba(0,0,0,.03)"
);

v.addColorStop(
.78,
"rgba(25,8,2,.30)"
);

v.addColorStop(
1,
"rgba(0,0,0,.88)"
);

x.fillStyle=v;

x.fillRect(
0,
0,
w,
h
);


/* =====================================================
   DIK VICTORIAANS KADER
===================================================== */

const b=Math.min(w,h)*.095;

x.save();


/* brede donkere rand */

x.fillStyle="rgba(12,6,3,.88)";

x.fillRect(
0,
0,
w,
b
);

x.fillRect(
0,
h-b,
w,
b
);

x.fillRect(
0,
0,
b,
h
);

x.fillRect(
w-b,
0,
b,
h
);


/* gouden oude lijn */

x.strokeStyle="#a07a47";
x.lineWidth=Math.max(2,b*.12);

x.strokeRect(
b*.55,
b*.55,
w-b*1.1,
h-b*1.1
);


/* zwarte lijn */

x.strokeStyle="#1b0d07";
x.lineWidth=Math.max(3,b*.18);

x.strokeRect(
b*.9,
b*.9,
w-b*1.8,
h-b*1.8
);


/* binnenste sierlijn */

x.strokeStyle="#927043";
x.lineWidth=2;

x.strokeRect(
b*1.25,
b*1.25,
w-b*2.5,
h-b*2.5
);


/* HOEKEN */

drawCorner(
x,b*1.15,b*1.15,1,1
);

drawCorner(
x,w-b*1.15,b*1.15,-1,1
);

drawCorner(
x,b*1.15,h-b*1.15,1,-1
);

drawCorner(
x,w-b*1.15,h-b*1.15,-1,-1
);


/* spinnenwebachtige sierlijnen */

x.strokeStyle="#725535";
x.lineWidth=1;

for(let i=0;i<8;i++){

const y=b*1.35+i*b*.65;

x.beginPath();

x.moveTo(b*1.4,y);

x.quadraticCurveTo(
w/2,
y-15,
w-b*1.4,
y
);

x.stroke();

}

x.restore();


/* =====================================================
   GROTE OUDE TITEL
===================================================== */

x.save();

x.textAlign="center";
x.textBaseline="middle";

const titleSize=Math.max(
28,
Math.min(w*.075,85)
);

x.font=
"bold "+
titleSize+
"px Georgia,Times New Roman,serif";


/* zwarte drukschaduw */

x.fillStyle="rgba(0,0,0,.95)";

x.fillText(
"HALTE PLANTSOEN",
w/2+4,
b*1.65+5
);


/* oude inkt */

x.fillStyle="#e0c38c";

x.fillText(
"HALTE PLANTSOEN",
w/2,
b*1.65
);


/* kleine sierlijn */

x.strokeStyle="#a17b4a";
x.lineWidth=2;

x.beginPath();

x.moveTo(
w*.28,
b*2.28
);

x.lineTo(
w*.72,
b*2.28
);

x.stroke();

x.restore();


/* =====================================================
   ONDERTITEL
===================================================== */

x.save();

x.textAlign="center";

const sub=Math.max(
13,
Math.min(w*.026,30)
);

x.font=
"bold "+
sub+
"px Georgia,Times New Roman,serif";

x.fillStyle="#d6b87d";

x.fillText(
"HALLOWEEN · 23 OKTOBER 2026",
w/2,
h-b*1.45
);

x.restore();


/* ornament boven en onder */

x.save();

x.textAlign="center";

x.fillStyle="#a27b47";

x.font=
Math.max(20,b*.4)+
"px Georgia";

x.fillText(
"❦",
w/2,
b*.65
);

x.fillText(
"❦",
w/2,
h-b*.35
);

x.restore();


return c;

}


/* =====================================================
   VICTORIAAN ORNAMENT
===================================================== */

function drawCorner(c,x,y,sx,sy){

c.save();

c.translate(x,y);
c.scale(sx,sy);

c.strokeStyle="#a17a48";
c.lineWidth=2.5;


/* grote krul */

c.beginPath();

c.moveTo(0,0);

c.bezierCurveTo(
35,
0,
42,
32,
14,
43
);

c.bezierCurveTo(
-10,
53,
3,
68,
25,
52
);

c.stroke();


/* tweede krul */

c.beginPath();

c.moveTo(6,6);

c.bezierCurveTo(
43,
10,
52,
42,
30,
65
);

c.stroke();


/* web */

c.globalAlpha=.8;

for(let i=0;i<6;i++){

c.beginPath();

c.moveTo(
5,
10+i*10
);

c.quadraticCurveTo(
20,
5+i*11,
35,
10+i*10
);

c.stroke();

}

c.restore();

}


/* =====================================================
   WACHTRIJ
===================================================== */

saveBtn.addEventListener(
"click",
()=>{

if(!processed.length)return;

for(const image of processed){

const data=image.toDataURL(
"image/jpeg",
.92
);

const card=document.createElement("div");

card.className="card";

const imageEl=document.createElement("img");

imageEl.src=data;

const info=document.createElement("div");

info.className="cardInfo";

info.textContent=
"Klaar voor beoordeling";

card.appendChild(imageEl);
card.appendChild(info);

queueGrid.prepend(card);

}

processed=[];

wrap.style.display="none";

filesInput.value="";

statusEl.textContent=
"Foto('s) staan nu in de wachtrij.";

}
);


/* =====================================================
   ANNULEREN
===================================================== */

clearBtn.addEventListener(
"click",
()=>{

processed=[];

wrap.style.display="none";

filesInput.value="";

statusEl.textContent=
"Kies één of meer foto's.";

}
);

</script>

</body>
</html>
