<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halte Plantsoen — Fotowachtrij 1913</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17130f;color:#eee7d8;font-family:Georgia,serif}
main{max-width:900px;margin:auto;padding:22px}
h1{font-size:30px;margin:0 0 6px}
.sub{opacity:.75;margin-bottom:22px}
button,.pick{display:inline-block;border:1px solid #9b8a68;background:#30281d;color:#f3ead8;padding:12px 16px;border-radius:7px;font:inherit;cursor:pointer}
input{display:none}
#status{margin:16px 0;min-height:24px}
#previewWrap{display:none;background:#241d15;padding:16px;border-radius:10px}
canvas{display:block;width:100%;height:auto;background:#d9c7a5}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
#queue{margin-top:28px}
.queueGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#241d15;padding:8px;border-radius:8px}
.card img{width:100%;display:block}
.card small{display:block;margin-top:6px;opacity:.75}
.note{font-size:14px;opacity:.65;line-height:1.5;margin-top:18px}
</style>
</head>
<body>
<main>
<h1>Halte Plantsoen</h1>
<div class="sub">Fotowachtrij · 1913 · Halloween 23 oktober 2026</div>

<label class="pick" for="files">KIES FOTO'S VAN JE SAMSUNG</label>
<input id="files" type="file" accept="image/*" multiple>

<div id="status">Kies één of meer foto's. De foto's worden op deze telefoon verwerkt.</div>

<div id="previewWrap">
  <canvas id="canvas"></canvas>
  <div class="actions">
    <button id="save">IN WACHTRIJ ZETTEN</button>
    <button id="clear">ANNULEREN</button>
  </div>
</div>

<section id="queue">
<h2>Wachtrij</h2>
<div id="queueGrid" class="queueGrid"></div>
</section>

<div class="note">
De originele Samsung-foto wordt niet veranderd. De site maakt een nieuwe versie met een oude 1913-uitstraling, kader en tekst.
</div>
</main>

<script>
const filesInput=document.getElementById("files");
const statusEl=document.getElementById("status");
const wrap=document.getElementById("previewWrap");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const queueGrid=document.getElementById("queueGrid");
const saveBtn=document.getElementById("save");
const clearBtn=document.getElementById("clear");

// ===== FOTO-ONTWERP — HIER KUNNEN WE LATER MAKKELIJK AANPASSEN =====
const PHOTO_STYLE = {
  titel: "HALTE PLANTSOEN",
  ondertekst: "HALLOWEEN · 23 OKTOBER 2026",

  // Filter: deze waarden kunnen we later aanpassen
  sepia: 0.65,
  saturate: 0.65,
  contrast: 1.05,
  brightness: 1.08,

  kaderKleur: "#d8c5a0",
  tekstKleur: "#352719"
};

let processed=[]; 

  function makeProcessed(img){

  const maxW=1800;
  const scale=Math.min(1,maxW/img.naturalWidth);
  const w=Math.round(img.naturalWidth*scale);
  const h=Math.round(img.naturalHeight*scale);

  // Smalle fotomarge + iets ruimere tekststrook
  const border=Math.max(38,Math.round(w*.025));
  const bottom=Math.max(190,Math.round(h*.145));

  canvas.width=w+border*2;
  canvas.height=h+border+bottom;

  // ===== PAPIER =====
  ctx.fillStyle="#211812";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // ===== FOTO OP TIJDELIJK CANVAS =====
  const photoCanvas=document.createElement("canvas");
  photoCanvas.width=w;
  photoCanvas.height=h;

  const pctx=photoCanvas.getContext("2d");
  pctx.drawImage(img,0,0,w,h);

  // ===== ECHTE OUDE-KLEURENFOTO =====
  const imageData=pctx.getImageData(0,0,w,h);
  const pixels=imageData.data;

  for(let i=0;i<pixels.length;i+=4){

    let r=pixels[i];
    let g=pixels[i+1];
    let b=pixels[i+2];

    // Lichte warme ouderdomstint,
    // maar kleuren blijven duidelijk zichtbaar
    r=r*1.06+5;
    g=g*0.98+2;
    b=b*0.88;

    // Iets minder moderne digitale verzadiging
    const avg=(r+g+b)/3;
    r=avg+(r-avg)*0.88;
    g=avg+(g-avg)*0.88;
    b=avg+(b-avg)*0.88;

    // Iets meer ouderwets contrast
    r=(r-128)*1.06+128;
    g=(g-128)*1.06+128;
    b=(b-128)*1.06+128;

    // Filmkorrel
    const grain=(Math.random()-0.5)*13;

    r+=grain;
    g+=grain;
    b+=grain;

    pixels[i]=Math.max(0,Math.min(255,r));
    pixels[i+1]=Math.max(0,Math.min(255,g));
    pixels[i+2]=Math.max(0,Math.min(255,b));
  }

  pctx.putImageData(imageData,0,0);

  // ===== FOTO PLAATSEN =====
  ctx.drawImage(
    photoCanvas,
    border,
    border
  );

  // ===== OUDE DONKERE HOEKEN =====
  const vignette=ctx.createRadialGradient(
    canvas.width/2,
    canvas.height/2,
    Math.min(w,h)*.22,
    canvas.width/2,
    canvas.height/2,
    Math.max(w,h)*.72
  );

  vignette.addColorStop(0,"rgba(0,0,0,0)");
  vignette.addColorStop(.62,"rgba(25,12,5,.02)");
  vignette.addColorStop(.84,"rgba(25,12,5,.16)");
  vignette.addColorStop(1,"rgba(5,3,2,.58)");

  ctx.fillStyle=vignette;
  ctx.fillRect(border,border,w,h);

  // ===== VERWEERDE VLEKKEN =====
  ctx.save();
  ctx.globalAlpha=.10;
  ctx.fillStyle="#d8bd82";

  for(let i=0;i<20;i++){
    const x=border+Math.random()*w;
    const y=border+Math.random()*h;
    const r=3+Math.random()*18;

    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();

  // ===== OUDE KRASSEN =====
  ctx.save();
  ctx.globalAlpha=.20;
  ctx.strokeStyle="#ead6a8";
  ctx.lineWidth=1;

  for(let i=0;i<25;i++){
    const x=border+Math.random()*w;
    const y=border+Math.random()*h;
    const lengte=8+Math.random()*70;

    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(
      x+lengte,
      y+(Math.random()*5-2.5)
    );
    ctx.stroke();
  }

  ctx.restore();

  // ===== DUBBELE OUDE FOTORAND =====
  ctx.strokeStyle="rgba(25,14,8,.95)";
  ctx.lineWidth=5;

  ctx.strokeRect(
    border,
    border,
    w,
    h
  );

  ctx.strokeStyle="rgba(220,190,130,.65)";
  ctx.lineWidth=2;

  ctx.strokeRect(
    border+8,
    border+8,
    w-16,
    h-16
  );

  // ===== ONDERSTE PAPIERSTROOK =====
  ctx.fillStyle="#b59a68";

  ctx.fillRect(
    border,
    border+h,
    w,
    bottom
  );

  // Lichte ouderdomsvlekken op papier
  ctx.save();
  ctx.globalAlpha=.10;
  ctx.fillStyle="#352015";

  for(let i=0;i<12;i++){
    const x=border+Math.random()*w;
    const y=border+h+Math.random()*bottom;
    const r=2+Math.random()*9;

    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();

  // ===== DECORATIEVE HALLOWEEN-LIJN =====
  ctx.strokeStyle="#392218";
  ctx.lineWidth=2;

  const decoY=border+h+25;

  ctx.beginPath();

  ctx.moveTo(border+25,decoY);

  ctx.bezierCurveTo(
    border+45,decoY-14,
    border+60,decoY+14,
    border+80,decoY
  );

  ctx.bezierCurveTo(
    border+100,decoY-14,
    border+120,decoY+14,
    border+140,decoY
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(border+w-25,decoY);

  ctx.bezierCurveTo(
    border+w-45,decoY-14,
    border+w-60,decoY+14,
    border+w-80,decoY
  );

  ctx.bezierCurveTo(
    border+w-100,decoY-14,
    border+w-120,decoY+14,
    border+w-140,decoY
  );

  ctx.stroke();

  // ===== GROTE TITEL =====
  ctx.fillStyle="#29170f";
  ctx.textAlign="center";

  ctx.font=
    "bold "+
    Math.max(36,Math.round(w*.058))+
    "px Georgia";

  ctx.fillText(
    PHOTO_STYLE.titel,
    canvas.width/2,
    border+h+Math.max(88,Math.round(h*.065))
  );

  // ===== ONDERTEXT =====
  ctx.font=
    Math.max(22,Math.round(w*.027))+
    "px Georgia";

  ctx.fillText(
    PHOTO_STYLE.ondertekst,
    canvas.width/2,
    border+h+Math.max(140,Math.round(h*.105))
  );

  // ===== KLEINE ORNAMENTEN ONDERAAN =====
  ctx.strokeStyle="#392218";
  ctx.lineWidth=2;

  const ornamentY=canvas.height-22;

  ctx.beginPath();
  ctx.arc(border+28,ornamentY,8,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(canvas.width-border-28,ornamentY,8,0,Math.PI*2);
  ctx.stroke();

  return canvas.toDataURL("image/jpeg",.94);
}


function readImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>resolve(img);
      img.onerror=reject;
      img.src=reader.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

filesInput.addEventListener("change",async()=>{
  if(!filesInput.files.length)return;

  statusEl.textContent="Foto's verwerken…";
  processed=[];
  wrap.style.display="none";

  try{
    for(const file of filesInput.files){
      const img=await readImage(file);
      processed.push(makeProcessed(img));
    }

    if(processed.length){
      const preview=new Image();
      preview.onload=()=>{
        canvas.width=preview.naturalWidth;
        canvas.height=preview.naturalHeight;
        ctx.drawImage(preview,0,0);
      };
      preview.src=processed[0];
      wrap.style.display="block";
      statusEl.textContent=processed.length+" foto"+(processed.length===1?"":"’s")+" verwerkt. Controleer de eerste foto.";
    }
  }catch(e){
    statusEl.textContent="Er ging iets mis met het inladen van de foto.";
  }
});

saveBtn.addEventListener("click",()=>{
  if(!processed.length)return;

  for(const data of processed){
    const card=document.createElement("div");
    card.className="card";

    const img=document.createElement("img");
    img.src=data;

    const small=document.createElement("small");
    small.textContent="Wacht op goedkeuring";

    card.appendChild(img);
    card.appendChild(small);
    queueGrid.prepend(card);
  }

  statusEl.textContent=processed.length+" foto"+(processed.length===1?"":"’s")+" staan in de wachtrij.";
  processed=[];
  filesInput.value="";
  wrap.style.display="none";
});

clearBtn.addEventListener("click",()=>{
  processed=[];
  filesInput.value="";
  wrap.style.display="none";
  statusEl.textContent="Kies één of meer foto's.";
});
</script>
</body>
</html>
