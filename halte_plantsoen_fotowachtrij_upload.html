<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halte Plantsoen — Fotowachtrij</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#17130f;
  color:#eee7d8;
  font-family:Georgia,serif
}

main{
  max-width:900px;
  margin:auto;
  padding:20px
}

h1{
  font-size:28px;
  margin:0 0 5px
}

.sub{
  opacity:.7;
  margin-bottom:18px
}

button,.pick{
  display:inline-block;
  border:1px solid #9b8a68;
  background:#30281d;
  color:#f3ead8;
  padding:12px 15px;
  border-radius:7px;
  font:inherit;
  cursor:pointer
}

input{
  display:none
}

#status{
  margin:14px 0;
  min-height:24px
}

#previewWrap{
  display:none;
  background:#241d15;
  padding:12px;
  border-radius:10px
}

canvas{
  display:block;
  width:100%;
  height:auto;
  background:#ddd
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px
}

#queue{
  margin-top:28px
}

.queueGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:12px
}

.card{
  background:#241d15;
  padding:8px;
  border-radius:8px
}

.card img{
  width:100%;
  display:block
}

.card small{
  display:block;
  margin-top:6px;
  opacity:.75
}

.card button{
  margin-top:8px;
  width:100%;
  padding:8px
}

.note{
  font-size:14px;
  opacity:.65;
  line-height:1.5;
  margin-top:18px
}
</style>
</head>

<body>

<main>

<h1>Halte Plantsoen</h1>

<div class="sub">
Fotowachtrij · 1913 · Halloween 23 oktober 2026
</div>

<label class="pick" for="files">
KIES FOTO'S VAN JE SAMSUNG
</label>

<input id="files" type="file" accept="image/*" multiple>

<div id="status">
Kies één of meer foto's. De originele foto's blijven ongewijzigd.
</div>

<div id="previewWrap">

<canvas id="canvas"></canvas>

<div class="actions">

<button id="save">
IN WACHTRIJ ZETTEN
</button>

<button id="clear">
ANNULEREN
</button>

</div>
</div>

<section id="queue">

<h2>Wachtrij</h2>

<div id="queueGrid" class="queueGrid"></div>

</section>

<div class="note">
Het kader en filter zijn ingebouwd in deze pagina.
De foto komt achter het transparante fotovak van het 1913-filter.
</div>

</main>

const PHOTO={
  x:31,
  y:36,
  w:1474,
  h:892
};

const filesInput=document.getElementById('files');
const statusEl=document.getElementById('status');
const wrap=document.getElementById('previewWrap');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const queueGrid=document.getElementById('queueGrid');

let processed=[];

const filterImg=new Image();

filterImg.src=FILTER_SRC;

filterImg.onload=()=>{
  canvas.width=filterImg.naturalWidth;
  canvas.height=filterImg.naturalHeight;
};

function readImage(file){

  return new Promise((resolve,reject)=>{

    const r=new FileReader();

    r.onload=()=>{

      const i=new Image();

      i.onload=()=>resolve(i);

      i.onerror=reject;

      i.src=r.result;
    };

    r.onerror=reject;

    r.readAsDataURL(file);
  });
}

function coverDraw(img,x,y,w,h){

  const s=Math.max(
    w/img.naturalWidth,
    h/img.naturalHeight
  );

  const dw=img.naturalWidth*s;
  const dh=img.naturalHeight*s;

  ctx.drawImage(
    img,
    x+(w-dw)/2,
    y+(h-dh)/2,
    dw,
    dh
  );
}

async function makeProcessed(img){

  canvas.width=filterImg.naturalWidth;
  canvas.height=filterImg.naturalHeight;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  coverDraw(
    img,
    PHOTO.x,
    PHOTO.y,
    PHOTO.w,
    PHOTO.h
  );

  ctx.drawImage(
    filterImg,
    0,
    0
  );

  return canvas.toDataURL(
    'image/jpeg',
    .94
  );
}

filesInput.addEventListener(
  'change',
  async()=>{

    if(!filesInput.files.length)return;

    statusEl.textContent=
      'Foto wordt voorzien van het 1913-filter…';

    processed=[];

    wrap.style.display='none';

    try{

      for(const file of filesInput.files){

        const img=await readImage(file);

        processed.push(
          await makeProcessed(img)
        );
      }

      if(processed.length){

        const p=new Image();

        p.onload=()=>{

          ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
          );

          ctx.drawImage(
            p,
            0,
            0
          );
        };

        p.src=processed[0];

        wrap.style.display='block';

        statusEl.textContent=
          processed.length+
          ' foto'+
          (processed.length===1?'':'’s')+
          ' verwerkt. Je ziet de eerste.';
      }

    }catch(e){

      console.error(e);

      statusEl.textContent=
        'Er ging iets mis met de foto.';
    }
  }
);

function addCard(data){

  const card=
    document.createElement('div');

  card.className='card';

  const img=
    document.createElement('img');

  img.src=data;

  const small=
    document.createElement('small');

  small.textContent=
    'Wacht op goedkeuring';

  const del=
    document.createElement('button');

  del.textContent=
    'VERWIJDEREN';

  del.onclick=()=>{
    card.remove();
  };

  card.append(
    img,
    small,
    del
  );

  queueGrid.prepend(card);
}

document.getElementById('save').onclick=()=>{

  processed.forEach(addCard);

  statusEl.textContent=
    processed.length+
    ' foto'+
    (processed.length===1?'':'’s')+
    ' staan in de wachtrij.';

  processed=[];

  filesInput.value='';

  wrap.style.display='none';
};

document.getElementById('clear').onclick=()=>{

  processed=[];

  filesInput.value='';

  wrap.style.display='none';

  statusEl.textContent=
    'Kies één of meer foto’s.';
};

</script>

</body>
</html>
