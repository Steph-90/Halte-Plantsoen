<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halte Plantsoen - Fotowachtrij</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#100d0a;
  color:#eadcc4;
  font-family:Georgia,"Times New Roman",serif;
}

body{
  background:
    radial-gradient(
      ellipse at top,
      #3b2b1d 0%,
      #17110d 45%,
      #080706 100%
    );
}

main{
  width:min(1050px,94%);
  margin:auto;
  padding:25px 0 55px;
}

/* =========================
   HEADER
========================= */

header{
  text-align:center;
  margin-bottom:24px;
}

.headerOrnament{
  color:#92744a;
  font-size:25px;
  letter-spacing:9px;
  margin-bottom:7px;
}

header h1{
  margin:0;
  color:#d9bf8b;
  font-size:clamp(32px,8vw,68px);
  letter-spacing:4px;
  line-height:1;
  text-shadow:
    2px 3px 0 #21140c,
    0 5px 18px #000;
}

header p{
  margin:11px 0 0;
  color:#b59d76;
  font-size:15px;
  letter-spacing:3px;
}

/* =========================
   UPLOAD
========================= */

.pick{
  display:block;
  width:100%;
  padding:18px;
  text-align:center;
  cursor:pointer;

  color:#ead5aa;
  background:
    linear-gradient(
      180deg,
      #493522,
      #24170f
    );

  border:1px solid #806442;

  box-shadow:
    inset 0 0 0 2px #130d08,
    0 8px 22px #000;
}

.pick:hover{
  background:
    linear-gradient(
      180deg,
      #594229,
      #2d1d12
    );
}

input[type=file]{
  display:none;
}

#status{
  text-align:center;
  color:#a9977c;
  font-size:14px;
  margin:13px 0 20px;
}

/* =========================
   PREVIEW
========================= */

#previewWrap{
  display:none;
  margin-bottom:38px;
}

.previewFrame{
  padding:12px;
  background:#0b0907;
  border:1px solid #654e32;
  box-shadow:
    0 12px 35px #000;
}

canvas{
  display:block;
  width:100%;
  height:auto;
}

/* =========================
   BUTTONS
========================= */

.actions{
  display:flex;
  gap:10px;
  margin-top:13px;
}

button{
  flex:1;
  padding:15px 12px;

  border:1px solid #765b38;

  background:
    linear-gradient(
      180deg,
      #3c291a,
      #21140d
    );

  color:#e9d5ad;

  font-family:Georgia,"Times New Roman",serif;
  font-weight:bold;
  letter-spacing:.7px;

  cursor:pointer;
}

button:hover{
  background:#503720;
}

/* =========================
   QUEUE
========================= */

#queue{
  margin-top:35px;
}

#queue h2{
  margin:0 0 18px;
  text-align:center;

  color:#c9af7d;

  font-size:28px;
  letter-spacing:3px;

  text-shadow:
    0 3px 10px #000;
}

.queueGrid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(190px,1fr));

  gap:16px;
}

.card{
  background:#1b130d;
  border:1px solid #5b452c;
  padding:8px;

  box-shadow:
    0 8px 20px #000;
}

.card img{
  display:block;
  width:100%;
  height:auto;
}

.cardInfo{
  padding:9px 3px 3px;

  text-align:center;

  color:#9d8b71;
  font-size:12px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  main{
    width:95%;
    padding-top:18px;
  }

  header h1{
    letter-spacing:2px;
  }

  .actions{
    flex-direction:column;
  }
}
</style>
</head>


<body>

<main>

<header>

  <div class="headerOrnament">
    ✦ ❦ ✦
  </div>

  <h1>

  </h1>

  <p>

  </p>

</header>


<label class="pick" for="files">
  KIES FOTO'S VAN JE SAMSUNG
</label>

<input

  type="file"
  accept="image/*"
  multiple
>


<div id="status">
  Kies één of meer foto's. De foto's worden op deze telefoon verwerkt.
</div>


<div id="previewWrap">

  <div class="previewFrame">

    <canvas id="canvas"></canvas>

  </div>


  <div class="actions">

    <button id="save">
      IN WACHTRIJ ZETTEN
    </button>

    <button id="clear">
      ANNULEREN
    </button>

  </div>

</div>


<section id="queue">

  <h2>
    ✦ WACHTRIJ ✦
  </h2>

  <div
    id="queueGrid"
    class="queueGrid"
  ></div>

</section>

</main>
