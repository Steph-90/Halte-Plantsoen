<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halte Plantsoen — Fotowachtrij 1913</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17130f;color:#eee7d8;font-family:Georgia,serif}
main{max-width:900px;margin:auto;padding:22px}
h1{font-size:30px;margin:0 0 6px}
.sub{opacity:.75;margin-bottom:22px}
button,.pick{display:inline-block;border:1px solid #9b8a68;background:#30281d;color:#f3ead8;padding:12px 16px;border-radius:7px;font:inherit;cursor:pointer}
input{display:none}
#status{margin:16px 0;min-height:24px}
#previewWrap{display:none;background:#241d15;padding:16px;border-radius:10px}
canvas{display:block;width:100%;height:auto;background:#d9c7a5}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
#queue{margin-top:28px}
.queueGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#241d15;padding:8px;border-radius:8px}
.card img{width:100%;display:block}
.card small{display:block;margin-top:6px;opacity:.75}
.note{font-size:14px;opacity:.65;line-height:1.5;margin-top:18px}
</style>
</head>
<body>
<main>
<h1>Halte Plantsoen</h1>
<div class="sub">Fotowachtrij · 1913 · Halloween 23 oktober 2026</div>

<label class="pick" for="files">KIES FOTO'S VAN JE SAMSUNG</label>
<input id="files" type="file" accept="image/*" multiple>

<div id="status">Kies één of meer foto's. De foto's worden op deze telefoon verwerkt.</div>

<div id="previewWrap">
  <canvas id="canvas"></canvas>
  <div class="actions">
    <button id="save">IN WACHTRIJ ZETTEN</button>
    <button id="clear">ANNULEREN</button>
  </div>
</div>

<section id="queue">
<h2>Wachtrij</h2>
<div id="queueGrid" class="queueGrid"></div>
</section>

<div class="note">
De originele Samsung-foto wordt niet veranderd. De site maakt een nieuwe versie met een oude 1913-uitstraling, kader en tekst.
</div>
</main>

<script>
const filesInput=document.getElementById("files");
const statusEl=document.getElementById("status");
const wrap=document.getElementById("previewWrap");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const queueGrid=document.getElementById("queueGrid");
const saveBtn=document.getElementById("save");
const clearBtn=document.getElementById("clear");

// ===== FOTO-ONTWERP — HIER KUNNEN WE LATER MAKKELIJK AANPASSEN =====
const PHOTO_STYLE = {
  titel: "HALTE PLANTSOEN",
  ondertekst: "HALLOWEEN · 23 OKTOBER 2026",

  // Filter: deze waarden kunnen we later aanpassen
  sepia: 0.65,
  saturate: 0.65,
  contrast: 1.05,
  brightness: 1.08,

  kaderKleur: "#d8c5a0",
  tekstKleur: "#352719"
};

let processed=[]; 

function makeProcessed(img){

  const maxW=1800;
  const scale=Math.min(1,maxW/img.naturalWidth);
  const w=Math.round(img.naturalWidth*scale);
  const h=Math.round(img.naturalHeight*scale);

  const border=Math.max(32,Math.round(w*.022));
  const bottom=Math.max(220,Math.round(h*.17));

  canvas.width=w+border*2;
  canvas.height=h+border+bottom;

  // =====================================================
  // ACHTERGROND / OUD PAPIER
  // =====================================================

  ctx.fillStyle="#b99a62";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // =====================================================
  // FOTO
  // KLEUR BLIJFT BEHOUDEN — ALLEEN OUDE FILMTOON
  // =====================================================

  const photo=document.createElement("canvas");
  photo.width=w;
  photo.height=h;

  const p=photo.getContext("2d");

  p.drawImage(img,0,0,w,h);

  const data=p.getImageData(0,0,w,h);
  const px=data.data;

  for(let i=0;i<px.length;i+=4){

    let r=px[i];
    let g=px[i+1];
    let b=px[i+2];

    // warme oude filmtoon
    r=r*1.035+3;
    g=g*.985+1;
    b=b*.91;

    // kleuren iets zachter, maar NIET weg
    const avg=(r+g+b)/3;

    r=avg+(r-avg)*.93;
    g=avg+(g-avg)*.93;
    b=avg+(b-avg)*.93;

    // ouderwets contrast
    r=(r-128)*1.08+128;
    g=(g-128)*1.08+128;
    b=(b-128)*1.08+128;

    // subtiele filmkorrel
    const grain=(Math.random()-.5)*10;

    px[i]=Math.max(0,Math.min(255,r+grain));
    px[i+1]=Math.max(0,Math.min(255,g+grain));
    px[i+2]=Math.max(0,Math.min(255,b+grain));
  }

  p.putImageData(data,0,0);

  ctx.drawImage(photo,border,border);

  // =====================================================
  // DONKERE VERWEERDE HOEKEN
  // =====================================================

  const vignette=ctx.createRadialGradient(
    canvas.width/2,
    border+h/2,
    Math.min(w,h)*.25,
    canvas.width/2,
    border+h/2,
    Math.max(w,h)*.72
  );

  vignette.addColorStop(0,"rgba(0,0,0,0)");
  vignette.addColorStop(.68,"rgba(20,10,4,.03)");
  vignette.addColorStop(.86,"rgba(30,15,5,.16)");
  vignette.addColorStop(1,"rgba(5,2,1,.62)");

  ctx.fillStyle=vignette;
  ctx.fillRect(border,border,w,h);

  // =====================================================
  // OUDE VLEKKEN / VERKLEURING
  // =====================================================

  ctx.save();
  ctx.globalAlpha=.13;

  for(let i=0;i<25;i++){

    const x=border+Math.random()*w;
    const y=border+Math.random()*h;
    const r=2+Math.random()*18;

    ctx.fillStyle=
      i%2===0 ? "#4b2c18" : "#e4c991";

    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();

  // =====================================================
  // KRASSEN / FILMSCHADE
  // =====================================================

  ctx.save();
  ctx.globalAlpha=.22;
  ctx.lineWidth=1;

  for(let i=0;i<32;i++){

    const x=border+Math.random()*w;
    const y=border+Math.random()*h;
    const lengte=10+Math.random()*80;

    ctx.strokeStyle=
      i%3===0 ? "#f0dfb4" : "#392116";

    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(
      x+lengte,
      y+(Math.random()*6-3)
    );
    ctx.stroke();
  }

  ctx.restore();

  // =====================================================
  // VERWEERDE FOTORAND
  // =====================================================

  ctx.strokeStyle="#2c180e";
  ctx.lineWidth=5;

  ctx.strokeRect(
    border,
    border,
    w,
    h
  );

  ctx.strokeStyle="rgba(232,204,151,.65)";
  ctx.lineWidth=2;

  ctx.strokeRect(
    border+8,
    border+8,
    w-16,
    h-16
  );

  // =====================================================
  // ONDERSTE OUDE PAPIERSTROOK
  // =====================================================

  ctx.fillStyle="#b99a62";

  ctx.fillRect(
    border,
    border+h,
    w,
    bottom
  );

  // papiertextuur
  ctx.save();
  ctx.globalAlpha=.12;

  for(let i=0;i<35;i++){

    const x=border+Math.random()*w;
    const y=border+h+Math.random()*bottom;
    const r=2+Math.random()*13;

    ctx.fillStyle=
      i%2 ? "#3b2113" : "#e5cc98";

    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();

  // =====================================================
  // HALLOWEEN / VICTORIAANSE ORNAMENTEN
  // =====================================================

  ctx.strokeStyle="#32190e";
  ctx.lineWidth=2;

  const decoY=border+h+31;

  // links
  ctx.beginPath();
  ctx.moveTo(border+25,decoY);

  ctx.bezierCurveTo(
    border+45,decoY-18,
    border+62,decoY+18,
    border+82,decoY
  );

  ctx.bezierCurveTo(
    border+102,decoY-18,
    border+122,decoY+18,
    border+148,decoY
  );

  ctx.stroke();

  // rechts
  ctx.beginPath();
  ctx.moveTo(border+w-25,decoY);

  ctx.bezierCurveTo(
    border+w-45,decoY-18,
    border+w-62,decoY+18,
    border+w-82,decoY
  );

  ctx.bezierCurveTo(
    border+w-102,decoY-18,
    border+w-122,decoY+18,
    border+w-148,decoY
  );

  ctx.stroke();

  // kleine spinwebachtige lijntjes
  ctx.globalAlpha=.65;

  ctx.beginPath();
  ctx.moveTo(border+18,decoY+55);
  ctx.lineTo(border+65,decoY+20);
  ctx.lineTo(border+90,decoY+60);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(border+w-18,decoY+55);
  ctx.lineTo(border+w-65,decoY+20);
  ctx.lineTo(border+w-90,decoY+60);
  ctx.stroke();

  ctx.globalAlpha=1;

  // =====================================================
  // GROTE TITEL
  // =====================================================

  ctx.fillStyle="#29160d";
  ctx.textAlign="center";

  ctx.font=
    "bold "+
    Math.max(38,Math.round(w*.06))+
    "px Georgia";

  ctx.fillText(
    PHOTO_STYLE.titel,
    canvas.width/2,
    border+h+Math.max(92,Math.round(h*.068))
  );

  // =====================================================
  // ONDERTITEL
  // =====================================================

  ctx.font=
    Math.max(22,Math.round(w*.028))+
    "px Georgia";

  ctx.fillText(
    PHOTO_STYLE.ondertekst,
    canvas.width/2,
    border+h+Math.max(145,Math.round(h*.108))
  );

  // =====================================================
  // KLEINE DECORATIEVE LIJN ONDERAAN
  // =====================================================

  ctx.strokeStyle="#32190e";
  ctx.lineWidth=2;

  const lineY=canvas.height-27;

  ctx.beginPath();
  ctx.moveTo(canvas.width/2-90,lineY);
  ctx.lineTo(canvas.width/2-15,lineY);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(canvas.width/2+15,lineY);
  ctx.lineTo(canvas.width/2+90,lineY);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(canvas.width/2,lineY,6,0,Math.PI*2);
  ctx.stroke();

  return canvas.toDataURL("image/jpeg",.94);
}
  
function readImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>resolve(img);
      img.onerror=reject;
      img.src=reader.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

filesInput.addEventListener("change",async()=>{
  if(!filesInput.files.length)return;

  statusEl.textContent="Foto's verwerken…";
  processed=[];
  wrap.style.display="none";

  try{
    for(const file of filesInput.files){
      const img=await readImage(file);
      processed.push(makeProcessed(img));
    }

    if(processed.length){
      const preview=new Image();
      preview.onload=()=>{
        canvas.width=preview.naturalWidth;
        canvas.height=preview.naturalHeight;
        ctx.drawImage(preview,0,0);
      };
      preview.src=processed[0];
      wrap.style.display="block";
      statusEl.textContent=processed.length+" foto"+(processed.length===1?"":"’s")+" verwerkt. Controleer de eerste foto.";
    }
  }catch(e){
    statusEl.textContent="Er ging iets mis met het inladen van de foto.";
  }
});

saveBtn.addEventListener("click",()=>{
  if(!processed.length)return;

  for(const data of processed){
    const card=document.createElement("div");
    card.className="card";

    const img=document.createElement("img");
    img.src=data;

    const small=document.createElement("small");
    small.textContent="Wacht op goedkeuring";

    card.appendChild(img);
    card.appendChild(small);
    queueGrid.prepend(card);
  }

  statusEl.textContent=processed.length+" foto"+(processed.length===1?"":"’s")+" staan in de wachtrij.";
  processed=[];
  filesInput.value="";
  wrap.style.display="none";
});

clearBtn.addEventListener("click",()=>{
  processed=[];
  filesInput.value="";
  wrap.style.display="none";
  statusEl.textContent="Kies één of meer foto's.";
});
</script>
</body>
</html>
