<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halte Plantsoen - Fotowachtrij</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#100b08;
  color:#ead7b2;
  font-family:Georgia,"Times New Roman",serif;
}

body{
  background:
    radial-gradient(circle at 50% 0,#3a281a,#130d09 50%,#070504);
}

main{
  width:min(1000px,94%);
  margin:auto;
  padding:24px 0 50px;
}

header{
  text-align:center;
  margin-bottom:24px;
}

header .orn{
  color:#a27b49;
  font-size:25px;
  letter-spacing:9px;
}

header h1{
  margin:6px 0 8px;
  color:#d9bd86;
  font-size:clamp(34px,8vw,68px);
  letter-spacing:3px;
  text-shadow:3px 3px #21120a,0 7px 18px #000;
}

header p{
  margin:0;
  color:#b89b6b;
  letter-spacing:3px;
}

#files{
  position:absolute;
  width:1px;
  height:1px;
  opacity:0;
}

.pick{
  display:block;
  padding:18px;
  text-align:center;
  cursor:pointer;
  color:#ead3a7;
  font-size:18px;
  font-weight:bold;
  background:linear-gradient(#4a321e,#21140c);
  border:2px solid #80603a;
  box-shadow:inset 0 0 0 3px #140b06,0 8px 20px #000;
}

#status{
  text-align:center;
  margin:13px 0 20px;
  color:#ad9875;
}

#previewWrap{
  display:none;
}

.preview{
  padding:12px;
  background:#080604;
  border:1px solid #684a2b;
  box-shadow:0 12px 35px #000;
}

canvas{
  display:block;
  width:100%;
  height:auto;
}

.actions{
  display:flex;
  gap:12px;
  margin-top:14px;
}

button{
  flex:1;
  padding:16px;
  color:#ead4aa;
  background:linear-gradient(#49311d,#21130b);
  border:2px solid #80603a;
  font:bold 17px Georgia,serif;
}

#queue{
  margin-top:40px;
}

#queue h2{
  text-align:center;
  color:#d0b37d;
  font-size:30px;
  letter-spacing:3px;
}

.queueGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:15px;
}

.card{
  background:#17100b;
  padding:8px;
  border:1px solid #65482b;
}

.card img{
  width:100%;
  display:block;
}

.cardInfo{
  text-align:center;
  padding:8px;
  color:#a18c6b;
  font-size:12px;
}

@media(max-width:600px){
  .actions{flex-direction:column}
}
</style>
</head>

<body>

<main>

<header>
  <div class="orn">✦ ❦ ✦</div>
  <h1>HALTE PLANTSOEN</h1>
  <p>HALLOWEEN · 23 OKTOBER 2026</p>
</header>

<input id="files" type="file" accept="image/*" multiple>

<label class="pick" for="files">
  KIES FOTO'S VAN JE SAMSUNG
</label>

<div id="status">
  Kies één of meer foto's.
</div>

<div id="previewWrap">

  <div class="preview">
    <canvas id="canvas"></canvas>
  </div>

  <div class="actions">
    <button id="save">IN WACHTRIJ ZETTEN</button>
    <button id="clear">ANNULEREN</button>
  </div>

</div>

<section id="queue">
  <h2>✦ WACHTRIJ ✦</h2>
  <div id="queueGrid" class="queueGrid"></div>
</section>

</main>

<script>

const filesInput=document.getElementById("files");
const statusEl=document.getElementById("status");
const wrap=document.getElementById("previewWrap");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const queueGrid=document.getElementById("queueGrid");
const saveBtn=document.getElementById("save");
const clearBtn=document.getElementById("clear");

let processed=[];


/* FOTO KIEZEN */

filesInput.addEventListener("change",async()=>{

  const files=[...filesInput.files];

  if(!files.length)return;

  statusEl.textContent="Foto wordt verwerkt...";

  processed=[];

  for(const file of files){

    const img=await loadImage(file);

    processed.push(makePhoto(img));

  }

  show(processed[0]);

  wrap.style.display="block";

  statusEl.textContent=
    processed.length===1
    ?"Foto klaar om te bekijken."
    :processed.length+" foto's klaar.";

});


/* FOTO LADEN */

function loadImage(file){

  return new Promise((resolve,reject)=>{

    const url=URL.createObjectURL(file);
    const img=new Image();

    img.onload=()=>{
      URL.revokeObjectURL(url);
      resolve(img);
    };

    img.onerror=reject;
    img.src=url;

  });

}


/* FOTO TONEN */

function show(img){

  canvas.width=img.width;
  canvas.height=img.height;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.drawImage(img,0,0);

}


/* =====================================================
   NIEUWE FOTO-STIJL
   Gebaseerd op de twee voorbeeldfoto's
===================================================== */

function makePhoto(img){

  let w=img.naturalWidth;
  let h=img.naturalHeight;

  const max=1600;

  if(w>max){

    const scale=max/w;

    w=Math.round(w*scale);
    h=Math.round(h*scale);

  }


  /*
     EXTRA HOOGTE VOOR DE PAPIEREN ONDERRAND
  */

  const photoHeight=Math.round(h*0.86);
  const panelHeight=Math.round(h*0.22);

  const totalHeight=photoHeight+panelHeight;


  const c=document.createElement("canvas");

  c.width=w;
  c.height=totalHeight;


  const x=c.getContext("2d");


  /* =================================================
     DONKERE OUDE BASIS
  ================================================= */

  x.fillStyle="#24150b";

  x.fillRect(
    0,
    0,
    w,
    totalHeight
  );


  /* =================================================
     FOTO
  ================================================= */

  x.drawImage(
    img,
    0,
    0,
    w,
    photoHeight
  );


  /* =================================================
     LICHTE OUDE FOTOTINT
     
     KLEUREN BLIJVEN BEHOUDEN
  ================================================= */

  const pixels=x.getImageData(
    0,
    0,
    w,
    photoHeight
  );

  const d=pixels.data;


  for(let i=0;i<d.length;i+=4){

    let r=d[i];
    let g=d[i+1];
    let b=d[i+2];


    /*
       Oude warme fotografische tint
       zonder de foto bruin te maken.
    */

    r=r*1.035;
    g=g*.985;
    b=b*.91;


    /*
       Klein beetje contrast
    */

    r=(r-128)*1.06+128;
    g=(g-128)*1.06+128;
    b=(b-128)*1.06+128;


    d[i]=Math.max(0,Math.min(255,r));
    d[i+1]=Math.max(0,Math.min(255,g));
    d[i+2]=Math.max(0,Math.min(255,b));

  }


  x.putImageData(
    pixels,
    0,
    0
  );


  /* =================================================
     OUDE FOTO - ZACHTE DONKERE HOEKEN
  ================================================= */

  const vignette=x.createRadialGradient(
    w/2,
    photoHeight*.48,
    Math.min(w,photoHeight)*.25,
    w/2,
    photoHeight*.48,
    Math.max(w,photoHeight)*.72
  );

  vignette.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );

  vignette.addColorStop(
    .72,
    "rgba(25,10,3,.05)"
  );

  vignette.addColorStop(
    1,
    "rgba(0,0,0,.58)"
  );

  x.fillStyle=vignette;

  x.fillRect(
    0,
    0,
    w,
    photoHeight
  );


  /* =================================================
     FILMGRAIN
  ================================================= */

  x.save();

  for(let i=0;i<4500;i++){

    const px=Math.random()*w;
    const py=Math.random()*photoHeight;

    const alpha=.018+Math.random()*.045;

    x.fillStyle=
      Math.random()>.5
      ?`rgba(255,235,195,${alpha})`
      :`rgba(20,8,2,${alpha})`;

    x.fillRect(
      px,
      py,
      Math.random()<.9?1:2,
      Math.random()<.9?1:2
    );

  }

  x.restore();


  /* =================================================
     OUDE VLEKKEN
  ================================================= */

  x.save();

  for(let i=0;i<22;i++){

    const px=Math.random()*w;
    const py=Math.random()*photoHeight;

    const r=8+Math.random()*45;

    const stain=x.createRadialGradient(
      px,py,0,
      px,py,r
    );

    stain.addColorStop(
      0,
      "rgba(65,30,10,.10)"
    );

    stain.addColorStop(
      1,
      "rgba(65,30,10,0)"
    );

    x.fillStyle=stain;

    x.beginPath();

    x.arc(
      px,
      py,
      r,
      0,
      Math.PI*2
    );

    x.fill();

  }

  x.restore();


  /* =================================================
     OUDE SCHEUREN / KRASSEN
  ================================================= */

  x.save();

  x.globalAlpha=.22;

  for(let i=0;i<24;i++){

    const px=Math.random()*w;
    const py=Math.random()*photoHeight;

    x.strokeStyle=
      Math.random()>.5
      ?"rgba(255,230,185,.8)"
      :"rgba(35,12,3,.8)";

    x.lineWidth=1;

    x.beginPath();

    x.moveTo(px,py);

    x.lineTo(
      px+15+Math.random()*140,
      py-8+Math.random()*16
    );

    x.stroke();

  }

  x.restore();


  /* =================================================
     PAPIEREN ONDERRAND
  ================================================= */

  const paperTop=photoHeight;

  const paperGradient=x.createLinearGradient(
    0,
    paperTop,
    0,
    totalHeight
  );

  paperGradient.addColorStop(
    0,
    "#c4a06b"
  );

  paperGradient.addColorStop(
    .45,
    "#d1b47d"
  );

  paperGradient.addColorStop(
    1,
    "#9b7648"
  );

  x.fillStyle=paperGradient;

  x.fillRect(
    0,
    paperTop,
    w,
    panelHeight
  );


  /* =================================================
     PAPIERSTRUCTUUR
  ================================================= */

  x.save();

  for(let i=0;i<3500;i++){

    const px=Math.random()*w;
    const py=
      paperTop+
      Math.random()*panelHeight;

    const alpha=.025+Math.random()*.08;

    x.fillStyle=
      Math.random()>.5
      ?`rgba(255,239,190,${alpha})`
      :`rgba(60,28,8,${alpha})`;

    x.fillRect(
      px,
      py,
      1+Math.random()*2,
      1+Math.random()*2
    );

  }

  x.restore();


  /* =================================================
     PAPIER VLEKKEN
  ================================================= */

  x.save();

  for(let i=0;i<25;i++){

    const px=Math.random()*w;

    const py=
      paperTop+
      Math.random()*panelHeight;

    const r=5+Math.random()*40;

    const stain=x.createRadialGradient(
      px,py,0,
      px,py,r
    );

    stain.addColorStop(
      0,
      "rgba(70,30,8,.20)"
    );

    stain.addColorStop(
      1,
      "rgba(70,30,8,0)"
    );

    x.fillStyle=stain;

    x.beginPath();

    x.arc(
      px,
      py,
      r,
      0,
      Math.PI*2
    );

    x.fill();

  }

  x.restore();


  /* =================================================
     TITEL OP PAPIER
  ================================================= */

  x.save();

  x.textAlign="center";
  x.textBaseline="middle";


  const titleSize=Math.max(
    25,
    Math.min(w*.075,78)
  );


  x.font=
    "bold "+
    titleSize+
    "px Georgia,'Times New Roman',serif";


  /* donkere drukinkt */

  x.fillStyle="rgba(45,22,8,.95)";

  x.fillText(
    "HALTE PLANTSOEN",
    w/2,
    paperTop+panelHeight*.43
  );


  /* datum */

  const subSize=Math.max(
    13,
    Math.min(w*.027,29)
  );


  x.font=
    "bold "+
    subSize+
    "px Georgia,'Times New Roman',serif";


  x.fillText(
    "HALLOWEEN · 23 OKTOBER 2026",
    w/2,
    paperTop+panelHeight*.76
  );


  x.restore();


  /* =================================================
     DECORATIE OP PAPIER
  ================================================= */

  drawPaperDecoration(
    x,
    20,
    paperTop+panelHeight*.70,
    1,
    1
  );


  drawPaperDecoration(
    x,
    w-20,
    paperTop+panelHeight*.70,
    -1,
    1
  );


  /* =================================================
     BOVENSTE OUDE FOTOLIJN
  ================================================= */

  x.strokeStyle="#8a6338";
  x.lineWidth=3;

  x.strokeRect(
    8,
    8,
    w-16,
    totalHeight-16
  );


  x.strokeStyle="rgba(48,22,7,.7)";
  x.lineWidth=1;

  x.strokeRect(
    15,
    15,
    w-30,
    totalHeight-30
  );


  /* =================================================
     AFGELEEFDE RAND
  ================================================= */

  x.save();

  for(let i=0;i<55;i++){

    const side=Math.floor(Math.random()*4);

    let px,py;

    if(side===0){
      px=Math.random()*w;
      py=Math.random()*10;
    }
    else if(side===1){
      px=Math.random()*w;
      py=totalHeight-10+Math.random()*10;
    }
    else if(side===2){
      px=Math.random()*10;
      py=Math.random()*totalHeight;
    }
    else{
      px=w-10+Math.random()*10;
      py=Math.random()*totalHeight;
    }

    x.fillStyle=
      Math.random()>.5
      ?"rgba(45,20,7,.65)"
      :"rgba(235,205,155,.35)";

    x.beginPath();

    x.arc(
      px,
      py,
      2+Math.random()*7,
      0,
      Math.PI*2
    );

    x.fill();

  }

  x.restore();


  return c;
}


/* =====================================================
   PAPIERDECORATIE
===================================================== */

function drawPaperDecoration(
  c,
  x,
  y,
  sx,
  sy
){

  c.save();

  c.translate(x,y);
  c.scale(sx,sy);

  c.strokeStyle="#3b1d0d";
  c.lineWidth=2;

  /* krul */

  c.beginPath();

  c.moveTo(0,0);

  c.bezierCurveTo(
    25,-25,
    55,-15,
    70,5
  );

  c.bezierCurveTo(
    80,20,
    55,27,
    48,10
  );

  c.bezierCurveTo(
    44,0,
    60,-5,
    66,5
  );

  c.stroke();


  /* tweede krul */

  c.beginPath();

  c.moveTo(5,4);

  c.bezierCurveTo(
    25,20,
    35,35,
    62,28
  );

  c.stroke();


  /* spinnenweb */

  c.globalAlpha=.9;

  c.beginPath();

  c.moveTo(0,0);
  c.lineTo(30,25);
  c.moveTo(0,0);
  c.lineTo(40,0);
  c.moveTo(0,0);
  c.lineTo(25,-25);

  c.stroke();


  for(let i=1;i<4;i++){

    c.beginPath();

    c.arc(
      0,
      0,
      i*10,
      -Math.PI*.8,
      Math.PI*.25
    );

    c.stroke();

  }


  /* klein takje */

  c.beginPath();

  c.moveTo(15,25);

  c.quadraticCurveTo(
    40,45,
    75,30
  );

  c.stroke();


  c.restore();
}


/* =====================================================
   WACHTRIJ
===================================================== */

saveBtn.addEventListener("click",()=>{

  if(!processed.length)return;

  for(const image of processed){

    const data=image.toDataURL(
      "image/jpeg",
      .92
    );

    const card=document.createElement("div");

    card.className="card";

    const imageEl=document.createElement("img");

    imageEl.src=data;

    const info=document.createElement("div");

    info.className="cardInfo";
    info.textContent="Klaar voor beoordeling";

    card.appendChild(imageEl);
    card.appendChild(info);

    queueGrid.prepend(card);
  }

  processed=[];

  wrap.style.display="none";

  filesInput.value="";

  statusEl.textContent=
    "Foto('s) staan nu in de wachtrij.";

});


/* =====================================================
   ANNULEREN
===================================================== */

clearBtn.addEventListener("click",()=>{

  processed=[];

  wrap.style.display="none";

  filesInput.value="";

  statusEl.textContent=
    "Kies één of meer foto's.";

});

</script>

</body>
</html>
